<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <rect width="1440" height="860" fill="#eef2f1"/>
  <text x="40" y="38" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#173c35">教师面板展开布局（待确认，不是最终美术稿）</text>
  <text x="40" y="68" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#56706a">点击“展开教师”后，教师窗口从主窗口右边界开始，和主窗口等高并排显示。</text>

  <!-- Main application window -->
  <rect x="40" y="105" width="930" height="670" rx="12" fill="#fffdf8" stroke="#214f45" stroke-width="3"/>
  <rect x="40" y="105" width="930" height="52" rx="12" fill="#214f45"/>
  <rect x="40" y="145" width="930" height="12" fill="#214f45"/>
  <circle cx="68" cy="131" r="7" fill="#8fd0b7"/>
  <text x="88" y="138" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#ffffff">MentorFlow · 原生课堂</text>
  <text x="900" y="138" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#dcebe6">主窗口</text>
  <rect x="73" y="190" width="860" height="64" rx="10" fill="#eef7f2" stroke="#b9d9cc"/>
  <text x="98" y="218" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#214f45">当前知识点：系统设计沟通方法</text>
  <text x="98" y="242" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#56706a">教师自动讲解 → 示例 → 最小检查；回答区仍留在主窗口。</text>
  <rect x="73" y="278" width="535" height="350" rx="10" fill="#ffffff" stroke="#d6e2dd"/>
  <text x="98" y="311" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#214f45">课堂内容与回答</text>
  <line x1="98" y1="337" x2="580" y2="337" stroke="#d6e2dd"/>
  <rect x="98" y="364" width="450" height="92" rx="8" fill="#f7faf8"/>
  <text x="118" y="395" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#405a54">结构化讲解、代码/示例、学习者回答</text>
  <rect x="98" y="486" width="450" height="112" rx="8" fill="#fffdf8" stroke="#d6e2dd"/>
  <text x="118" y="520" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#81918c">写下你的回答……</text>
  <rect x="636" y="278" width="297" height="350" rx="10" fill="#f7faf8" stroke="#d6e2dd"/>
  <text x="660" y="311" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#214f45">本回合依据</text>
  <text x="660" y="345" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#56706a">材料证据、检查题与状态</text>
  <rect x="73" y="655" width="860" height="75" rx="10" fill="#f1f5f3" stroke="#d6e2dd"/>
  <text x="98" y="687" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#405a54">识别语音 / 转文字</text>
  <rect x="710" y="670" width="198" height="40" rx="20" fill="#2f826b"/>
  <text x="760" y="696" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#ffffff">展开教师</text>

  <!-- Boundary marker -->
  <line x1="970" y1="88" x2="970" y2="790" stroke="#d68b4d" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="900" y="810" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#b4672f">主窗口右边界</text>

  <!-- Teacher window attached to the right boundary -->
  <rect x="970" y="105" width="410" height="670" rx="12" fill="#f8fffc" stroke="#2f826b" stroke-width="3"/>
  <rect x="970" y="105" width="410" height="52" rx="12" fill="#2f826b"/>
  <rect x="970" y="145" width="410" height="12" fill="#2f826b"/>
  <text x="998" y="138" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#ffffff">教师建模 · 2D/语音</text>
  <text x="1308" y="138" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#e5f5ee">独立面板</text>
  <rect x="998" y="190" width="354" height="330" rx="10" fill="#102c31"/>
  <ellipse cx="1195" cy="355" rx="112" ry="130" fill="#244c52" stroke="#8fd0b7" stroke-width="3"/>
  <circle cx="1160" cy="335" r="14" fill="#dff7ee"/>
  <circle cx="1230" cy="335" r="14" fill="#dff7ee"/>
  <path d="M1155 405 Q1195 440 1235 405" fill="none" stroke="#8fd0b7" stroke-width="6" stroke-linecap="round"/>
  <text x="1082" y="478" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#dff7ee">同步展示教师形象与状态</text>
  <rect x="998" y="548" width="354" height="96" rx="10" fill="#eaf6f0" stroke="#b9d9cc"/>
  <text x="1020" y="582" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#214f45">当前动作：等待你的回答</text>
  <text x="1020" y="610" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#56706a">面板可独立关闭；不会遮挡其他软件。</text>
  <rect x="998" y="665" width="166" height="40" rx="20" fill="#ffffff" stroke="#2f826b"/>
  <text x="1040" y="691" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#214f45">收起教师</text>
  <rect x="1186" y="665" width="166" height="40" rx="20" fill="#2f826b"/>
  <text x="1210" y="691" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#ffffff">准备教师资源</text>

  <!-- dimension arrows -->
  <line x1="970" y1="795" x2="1380" y2="795" stroke="#2f826b" stroke-width="2"/>
  <polygon points="970,795 984,788 984,802" fill="#2f826b"/>
  <polygon points="1380,795 1366,788 1366,802" fill="#2f826b"/>
  <text x="1085" y="835" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#214f45">教师面板宽度：专门用于建模展示</text>
  <line x1="1418" y1="105" x2="1418" y2="775" stroke="#2f826b" stroke-width="2"/>
  <polygon points="1418,105 1411,119 1425,119" fill="#2f826b"/>
  <polygon points="1418,775 1411,761 1425,761" fill="#2f826b"/>
  <text x="1434" y="405" transform="rotate(90 1434 405)" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#214f45">与主窗口等高</text>
</svg>
