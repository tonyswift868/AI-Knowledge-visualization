services:
  postgres:
    image: docker.io/library/postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_DB: "${E1_RLS_DATABASE:?E1_RLS_DATABASE is required}"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${E1_POSTGRES_PASSWORD:?E1_POSTGRES_PASSWORD is required}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  one-shot-test-runner:
    image: "mentorflow-e102-real-gate:${GITHUB_SHA:?GITHUB_SHA is required}"
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: backend-base
      args:
        VCS_REF: "${GITHUB_SHA}"
    working_dir: /workspace
    volumes:
      - ../../..:/workspace:ro
      - runner-data:/var/lib/mentorflow
    environment:
      E1_EXPECTED_POSTGRES_VERSION: "17.6"
      E1_REAL_GATE_REQUIRED: "1"
      E1_POSTGRES_PASSWORD: "${E1_POSTGRES_PASSWORD:?E1_POSTGRES_PASSWORD is required}"
      E1_POSTGRES_ADMIN_DSN: "postgresql+psycopg://postgres:${E1_POSTGRES_PASSWORD}@postgres:5432/postgres"
      E1_WORKER_DATABASE: "${E1_WORKER_DATABASE:?E1_WORKER_DATABASE is required}"
      E1_WORKER_MIGRATION_DSN: "postgresql+psycopg://postgres:${E1_POSTGRES_PASSWORD}@postgres:5432/${E1_WORKER_DATABASE}"
      E1_WORKER_RUNTIME_DSN: "postgresql+psycopg://mentorflow_app:${E1_APP_PASSWORD}@postgres:5432/${E1_WORKER_DATABASE}"
      E1_APP_PASSWORD: "${E1_APP_PASSWORD:?E1_APP_PASSWORD is required}"
      MENTORFLOW_RLS_DSN: "postgresql+psycopg://postgres:${E1_POSTGRES_PASSWORD}@postgres:5432/${E1_RLS_DATABASE}"
      MENTORFLOW_PROVIDER_MODE: fake
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /workspace/backend
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    command:
      - /bin/sh
      - -ec
      - |
        python -m pytest -q -s --maxfail=1 -m rls \
          backend/tests/test_enterprise_tenant_persistence.py::test_real_postgres_rls_is_fail_closed_and_pool_safe
        python -m pytest -q -s --maxfail=1 \
          backend/tests/test_enterprise_postgres_worker_integration.py::test_real_postgres17_worker_process_consumes_durable_job
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  runner-data:
