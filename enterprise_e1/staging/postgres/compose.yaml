services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: mentorflow_e1_02b
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mentorflow-e1-02b-staging-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mentorflow_e1_02b"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "${E1_02B_POSTGRES_PORT:-18412}:5432"

  backend-tools:
    image: "${MENTORFLOW_BACKEND_IMAGE:?set MENTORFLOW_BACKEND_IMAGE to the Ubuntu backend image after the PostgreSQL driver lease is granted}"
    working_dir: /workspace/backend
    volumes:
      - ../../..:/workspace:ro
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:mentorflow-e1-02b-staging-only@postgres:5432/mentorflow_e1_02b
      PYTHONPATH: /workspace/backend
    command: ["python", "--version"]
    depends_on:
      postgres:
        condition: service_healthy

  pool-gate:
    extends:
      service: backend-tools
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/backend
      E1_DATABASE_URL: postgresql+psycopg://postgres:mentorflow-e1-02b-staging-only@postgres:5432/mentorflow_e1_02b
    command: ["python", "enterprise_e1/staging/e1_02/run_pool_gate.py"]
