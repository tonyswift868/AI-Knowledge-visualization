name: "${MENTORFLOW_COMPOSE_PROJECT:?MENTORFLOW_COMPOSE_PROJECT is required}"

x-secure-service: &secure-service
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

x-app-environment: &app-environment
  MENTORFLOW_PROVIDER_MODE: fake
  MENTORFLOW_OTEL_ENDPOINT: http://otel-collector:4318

services:
  postgres:
    profiles: [minimal, full]
    image: "${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}"
    environment:
      POSTGRES_DB: mentorflow
      POSTGRES_USER: mentorflow
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-mentorflow-keycloak.sh:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=64m,mode=1777
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_reservation: ${POSTGRES_MEMORY_RESERVATION:-384m}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-768m}
    cpus: ${POSTGRES_CPUS:-0.5}
    networks: [internal]
    <<: *secure-service

  keycloak:
    profiles: [minimal, full]
    image: "${KEYCLOAK_IMAGE:?KEYCLOAK_IMAGE is required}"
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)";
        export KC_DB_PASSWORD="$$(cat /run/secrets/postgres_password)";
        exec /opt/keycloak/bin/kc.sh start
        --http-enabled=true --hostname-strict=false --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-mentorflow-staging-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: mentorflow_keycloak
      KC_DB_USERNAME: mentorflow
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=35
    secrets: [postgres_password, keycloak_admin_password]
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /opt/keycloak/data/tmp:size=128m,mode=1777
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "bash -ec \"exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3\""]
      interval: 15s
      timeout: 5s
      retries: 16
      start_period: 45s
    mem_reservation: ${KEYCLOAK_MEMORY_RESERVATION:-512m}
    mem_limit: ${KEYCLOAK_MEMORY_LIMIT:-896m}
    cpus: ${KEYCLOAK_CPUS:-0.75}
    networks: [internal]
    <<: *secure-service

  migrate:
    profiles: [minimal, full]
    image: "${MENTORFLOW_BACKEND_IMAGE:?MENTORFLOW_BACKEND_IMAGE is required}"
    working_dir: /app/backend
    command: [python, -m, alembic, -c, alembic.ini, upgrade, heads]
    env_file: ["${MENTORFLOW_RUNTIME_ENV_FILE:?MENTORFLOW_RUNTIME_ENV_FILE is required}"]
    environment: *app-environment
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]
    restart: "no"
    read_only: true
    tmpfs: [/tmp:size=128m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  migration-verify:
    profiles: [minimal, full]
    image: "${MENTORFLOW_BACKEND_IMAGE:?MENTORFLOW_BACKEND_IMAGE is required}"
    working_dir: /app/backend
    command: [python, -m, alembic, -c, alembic.ini, current, --check-heads]
    env_file: ["${MENTORFLOW_RUNTIME_ENV_FILE:?MENTORFLOW_RUNTIME_ENV_FILE is required}"]
    environment: *app-environment
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]
    restart: "no"
    read_only: true
    tmpfs: [/tmp:size=128m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  backend:
    profiles: [minimal, full]
    image: "${MENTORFLOW_BACKEND_IMAGE:?MENTORFLOW_BACKEND_IMAGE is required}"
    env_file: ["${MENTORFLOW_RUNTIME_ENV_FILE:?MENTORFLOW_RUNTIME_ENV_FILE is required}"]
    environment: *app-environment
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_reservation: ${BACKEND_MEMORY_RESERVATION:-256m}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-512m}
    cpus: ${BACKEND_CPUS:-0.6}
    tmpfs: [/tmp:size=256m,mode=1777]
    networks: [internal]
    <<: *secure-service

  frontend:
    profiles: [minimal, full]
    image: "${MENTORFLOW_FRONTEND_IMAGE:?MENTORFLOW_FRONTEND_IMAGE is required}"
    depends_on:
      backend: {condition: service_healthy}
    ports: ["127.0.0.1:${MENTORFLOW_CANDIDATE_PORT:?MENTORFLOW_CANDIDATE_PORT is required}:8080"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_reservation: ${FRONTEND_MEMORY_RESERVATION:-32m}
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-128m}
    cpus: ${FRONTEND_CPUS:-0.1}
    tmpfs: [/tmp:size=64m,mode=1777]
    networks: [internal, edge]
    <<: *secure-service

  worker:
    profiles: [minimal, full]
    image: "${MENTORFLOW_WORKER_IMAGE:?MENTORFLOW_WORKER_IMAGE is required}"
    env_file: ["${MENTORFLOW_RUNTIME_ENV_FILE:?MENTORFLOW_RUNTIME_ENV_FILE is required}"]
    environment: *app-environment
    mem_reservation: ${WORKER_MEMORY_RESERVATION:-192m}
    mem_limit: ${WORKER_MEMORY_LIMIT:-384m}
    cpus: ${WORKER_CPUS:-0.45}
    tmpfs: [/tmp:size=256m,mode=1777]
    networks: [internal]
    <<: *secure-service

  otel-collector:
    profiles: [minimal, full]
    image: "${OTEL_COLLECTOR_IMAGE:?OTEL_COLLECTOR_IMAGE is required}"
    command: [--config=/etc/otelcol/config.yml]
    volumes: [./otel-collector.minimal.yml:/etc/otelcol/config.yml:ro]
    mem_reservation: ${OTEL_COLLECTOR_MEMORY_RESERVATION:-64m}
    mem_limit: ${OTEL_COLLECTOR_MEMORY_LIMIT:-192m}
    cpus: ${OTEL_COLLECTOR_CPUS:-0.2}
    tmpfs: [/tmp:size=64m,mode=1777]
    networks: [internal]
    <<: *secure-service

  object-store:
    profiles: [full]
    image: "${OBJECT_STORE_IMAGE:-mentorflow/full-profile-object-store-not-resolved}"
    command: [server, /data, --console-address, ":9001"]
    env_file: ["${MENTORFLOW_RUNTIME_ENV_FILE:?MENTORFLOW_RUNTIME_ENV_FILE is required}"]
    volumes: [object-store-data:/data]
    mem_reservation: ${OBJECT_STORE_MEMORY_RESERVATION:-256m}
    mem_limit: ${OBJECT_STORE_MEMORY_LIMIT:-512m}
    cpus: ${OBJECT_STORE_CPUS:-0.4}
    networks: [internal]
    <<: *secure-service

  prometheus:
    profiles: [full]
    image: "${PROMETHEUS_IMAGE:-mentorflow/full-profile-prometheus-not-resolved}"
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=3d]
    volumes:
      - ./prometheus.staging.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_reservation: ${PROMETHEUS_MEMORY_RESERVATION:-384m}
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-768m}
    cpus: ${PROMETHEUS_CPUS:-0.5}
    networks: [internal]
    <<: *secure-service

  grafana:
    profiles: [full]
    image: "${GRAFANA_IMAGE:-mentorflow/full-profile-grafana-not-resolved}"
    env_file: ["${MENTORFLOW_RUNTIME_ENV_FILE:?MENTORFLOW_RUNTIME_ENV_FILE is required}"]
    volumes: [grafana-data:/var/lib/grafana]
    mem_reservation: ${GRAFANA_MEMORY_RESERVATION:-192m}
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-384m}
    cpus: ${GRAFANA_CPUS:-0.3}
    networks: [internal]
    <<: *secure-service

  testing-services:
    profiles: [full]
    image: "${TESTING_SERVICES_IMAGE:-mentorflow/full-profile-testing-services-not-resolved}"
    command: [sleep, infinity]
    mem_reservation: ${TESTING_SERVICES_MEMORY_RESERVATION:-512m}
    mem_limit: ${TESTING_SERVICES_MEMORY_LIMIT:-1536m}
    cpus: ${TESTING_SERVICES_CPUS:-1.0}
    networks: [internal]
    <<: *secure-service

secrets:
  postgres_password:
    file: "${MENTORFLOW_SECRETS_DIR:?MENTORFLOW_SECRETS_DIR is required}/postgres_password"
  keycloak_admin_password:
    file: "${MENTORFLOW_SECRETS_DIR:?MENTORFLOW_SECRETS_DIR is required}/keycloak_admin_password"

volumes:
  postgres-data:
    name: mentorflow-staging-postgres-data
  object-store-data:
    name: mentorflow-staging-object-store-data
  prometheus-data:
    name: mentorflow-staging-prometheus-data
  grafana-data:
    name: mentorflow-staging-grafana-data

networks:
  internal:
    internal: true
  edge:
