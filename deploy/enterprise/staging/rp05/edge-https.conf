worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
  scgi_temp_path /var/cache/nginx/scgi_temp;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Port 443;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream mentorflow_backend {
    zone mentorflow_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server backend:8000 resolve;
  }

  upstream mentorflow_keycloak {
    zone mentorflow_keycloak 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server keycloak:8080 resolve;
  }

  upstream mentorflow_frontend {
    zone mentorflow_frontend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server frontend:8080 resolve;
  }

  server {
    listen 8080;
    server_name _;
    return 308 https://$host$request_uri;
  }

  server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location /realms/ { proxy_pass http://mentorflow_keycloak; }
    location /resources/ { proxy_pass http://mentorflow_keycloak; }
    location /robots.txt { proxy_pass http://mentorflow_frontend; }
    location /health/ { proxy_pass http://mentorflow_backend; }
    location /api/ { proxy_read_timeout 300s; proxy_buffering off; proxy_pass http://mentorflow_backend; }
    location / { proxy_pass http://mentorflow_frontend; }
  }
}
