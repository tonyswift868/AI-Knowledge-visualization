# Optional Account Core overlay; NOT active merely because this file exists.
# Apply only with the compatible backend image and the approved shared window.
# Deliberately no keycloak service / KC_HOSTNAME / realm / client mutation.
services:
  backend:
    environment:
      MENTORFLOW_KEYCLOAK_ISSUER: https://auth.clannad.win/realms/mentorflow
      MENTORFLOW_KEYCLOAK_TRANSPORT_ISSUER: https://localhost:18080/realms/mentorflow
      MENTORFLOW_KEYCLOAK_IDENTITY_ISSUER: https://localhost:18080/realms/mentorflow
      MENTORFLOW_KEYCLOAK_ISSUER_MIGRATION_JSON: "${MENTORFLOW_E109_ISSUER_MIGRATION_JSON:?approved bounded issuer migration window required}"
