worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    error_log /dev/stderr warn;
    client_max_body_size 1m;
    proxy_buffering off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream mentorflow_account_core_backend {
        zone mentorflow_account_core_backend 64k;
        server backend:8000 resolve;
    }

    upstream mentorflow_account_core_identity {
        zone mentorflow_account_core_identity 64k;
        server keycloak:8080 resolve;
    }

    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_private_key;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Only typed sync entity writes receive aggregate capacity plus envelope.
        # Auth, ordinary uploads and all other routes retain the 1m default.
        location ~ ^/api/enterprise/sync/v1/entities/[a-z_]+/[A-Za-z0-9][A-Za-z0-9._:-]*$ {
            client_max_body_size 9m;
            proxy_pass http://mentorflow_account_core_backend;
            proxy_read_timeout 60s;
        }

        # Bounded synchronous closure; recovery token is a header, never a URL.
        location ^~ /api/enterprise/account/closure/ {
            client_max_body_size 4k;
            proxy_pass http://mentorflow_account_core_backend;
            proxy_read_timeout 90s;
            proxy_next_upstream off;
        }

        location /api/ {
            proxy_pass http://mentorflow_account_core_backend;
            proxy_read_timeout 30s;
        }

        location /health/ {
            proxy_pass http://mentorflow_account_core_backend;
            proxy_read_timeout 5s;
        }

        location /realms/ {
            proxy_pass http://mentorflow_account_core_identity;
            proxy_read_timeout 30s;
        }

        location /resources/ {
            proxy_pass http://mentorflow_account_core_identity;
            proxy_read_timeout 30s;
        }

        location / {
            return 404;
        }
    }
}
