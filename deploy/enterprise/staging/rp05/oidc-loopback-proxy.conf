worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;

    upstream mentorflow_keycloak {
        zone mentorflow_keycloak 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        server keycloak:8080 resolve;
    }

    server {
        listen 127.0.0.1:18080 ssl;
        server_name localhost;

        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_private_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:OIDC:1m;
        ssl_session_timeout 10m;

        location /realms/mentorflow/ {
            proxy_pass http://mentorflow_keycloak;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_buffering off;
        }

        location / {
            return 404;
        }
    }
}
