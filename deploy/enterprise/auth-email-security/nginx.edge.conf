worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    error_log /dev/stderr warn;
    client_max_body_size 1m;
    proxy_buffering off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }


    # E109 auth abuse controls: empty keys leave GET, CSS, JS and redirects alone.
    map "$request_method:$uri" $e109_token_key {
        default "";
        ~^POST:/realms/[^/]+/protocol/openid-connect/token$ $binary_remote_addr;
    }
    map "$request_method:$uri" $e109_login_key {
        default "";
        ~^POST:/realms/[^/]+/login-actions/authenticate$ $binary_remote_addr;
    }
    # Match the normalized path, not raw execution query arguments: encoded or
    # repeated parameters must not bypass the shared email-action budget.
    # All required-action POSTs share this budget, including password updates.
    map "$request_method:$uri" $e109_email_key {
        default "";
        ~^POST:/realms/[^/]+/login-actions/(registration|reset-credentials|restart|send-verify-email|email-verification)$ $binary_remote_addr;
        ~^POST:/realms/[^/]+/login-actions/required-action$ $binary_remote_addr;
    }
    limit_req_zone $e109_token_key zone=e109_auth_token:1m rate=30r/m;
    limit_req_zone $e109_login_key zone=e109_auth_login:1m rate=10r/m;
    limit_req_zone $e109_email_key zone=e109_auth_email:1m rate=3r/m;
    # Self-registration stays unreachable publicly even during admin-only UAT.
    geo $e109_admin_source {
        default 0;
        127.0.0.1 1;
        172.19.0.1 1;
        89.45.45.28 1;
    }
    map "$uri:$arg_prompt" $e109_is_registration {
        default 0;
        ~^/realms/mentorflow/login-actions/registration 1;
        ~^/realms/mentorflow/protocol/openid-connect/registrations 1;
        ~^/realms/mentorflow/protocol/openid-connect/auth:.*create 1;
    }
    map "$e109_is_registration:$e109_admin_source" $e109_registration_denied {
        default 0;
        "1:0" 1;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream mentorflow_account_core_backend {
        zone mentorflow_account_core_backend 64k;
        server backend:8000 resolve;
    }

    upstream mentorflow_account_core_identity {
        zone mentorflow_account_core_identity 64k;
        server keycloak:8080 resolve;
    }

    # E108 public IP certificate; preserve existing localhost SNI certificate.
    map $ssl_server_name $e108_certificate {
        default /run/secrets/e108-ip-tls/active/fullchain.pem;
        localhost /run/secrets/tls_certificate;
        127.0.0.1 /run/secrets/tls_certificate;
    }
    map $ssl_server_name $e108_private_key {
        default /run/secrets/e108-ip-tls/active/privkey.pem;
        localhost /run/secrets/tls_private_key;
        127.0.0.1 /run/secrets/tls_private_key;
    }

    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate $e108_certificate;
        ssl_certificate_key $e108_private_key;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # E108 static update assets; publisher writes only over the admin channel.
        location = /mentorflow/updates/e108 { return 308 /mentorflow/updates/e108/; }
        location ^~ /mentorflow/updates/e108/ {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            set $e108_static http://mentorflow-e108-update-static:8081;
            proxy_pass $e108_static;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/ {
            proxy_pass http://mentorflow_account_core_backend;
            proxy_read_timeout 30s;
        }

        location /health/ {
            proxy_pass http://mentorflow_account_core_backend;
            proxy_read_timeout 5s;
        }

        location /realms/ {
            if ($e109_registration_denied) { return 403; }
            limit_req zone=e109_auth_token burst=20 nodelay;
            limit_req zone=e109_auth_login burst=10 nodelay;
            limit_req zone=e109_auth_email burst=3 nodelay;
            limit_req_status 429;
            # Never log auth query strings or reset links on rate-limit errors.
            error_log /dev/null crit;
            proxy_set_header Host localhost:18080;
            proxy_set_header X-Forwarded-Host localhost:18080;
            proxy_set_header X-Forwarded-Port 18080;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Server "";
            proxy_set_header X-Original-Forwarded-For "";
            proxy_set_header X-Original-URL "";
            proxy_set_header X-Original-Method "";
            proxy_set_header X-Forwarded-Access-Token "";
            proxy_set_header Connection "";
            proxy_pass http://mentorflow_account_core_identity;
            proxy_read_timeout 30s;
        }

        location /resources/ {
            proxy_pass http://mentorflow_account_core_identity;
            proxy_read_timeout 30s;
        }

        location / {
            return 404;
        }
    }
}
