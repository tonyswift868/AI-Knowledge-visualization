name: mentorflow-staging

services:
  migrate:
    image: ${MENTORFLOW_BACKEND_IMAGE:?MENTORFLOW_BACKEND_IMAGE is required}
    command: [python, -c, "from app.orm import upgrade_orm_schema; upgrade_orm_schema()"]
    environment: &mentorflow-environment
      MENTORFLOW_DB: /var/lib/mentorflow/app.db
      MENTORFLOW_ORM_DB: /var/lib/mentorflow/mentorflow_v2.db
      MENTORFLOW_ALLOWED_ORIGINS: ${MENTORFLOW_ALLOWED_ORIGINS:?MENTORFLOW_ALLOWED_ORIGINS is required}
      MENTORFLOW_PROVIDER_MODE: fake
    volumes: [mentorflow-data:/var/lib/mentorflow]
    read_only: true
    tmpfs: [/tmp:size=128m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  backend:
    image: ${MENTORFLOW_BACKEND_IMAGE:?MENTORFLOW_BACKEND_IMAGE is required}
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment: *mentorflow-environment
    volumes: [mentorflow-data:/var/lib/mentorflow]
    read_only: true
    tmpfs: [/tmp:size=256m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: ${MENTORFLOW_FRONTEND_IMAGE:?MENTORFLOW_FRONTEND_IMAGE is required}
    depends_on:
      backend: {condition: service_healthy}
    ports: ["127.0.0.1:${MENTORFLOW_PORT:-8080}:8080"]
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  document-worker:
    profiles: [document-worker]
    image: ${MENTORFLOW_DOCUMENT_WORKER_IMAGE:?MENTORFLOW_DOCUMENT_WORKER_IMAGE is required}
    environment: *mentorflow-environment
    volumes:
      - mentorflow-data:/var/lib/mentorflow
      - ${MENTORFLOW_DOCUMENT_WORKER_CONFIG:-/staging-required/document-worker-config.json}:/run/mentorflow/document-worker-config.json:ro
    read_only: true
    tmpfs: [/tmp:size=512m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  mentorflow-data:
