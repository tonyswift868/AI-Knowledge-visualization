name: Pinned Windows release tools
description: Official setup actions with pip/npm caches; no tests, no signing keys
inputs:
  requirements:
    description: Exact pinned Python dependencies
    default: scripts/release/requirements-installer.txt
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12.10'
        cache: pip
        cache-dependency-path: ${{ inputs.requirements }}
    - uses: actions/setup-node@v7
      with:
        node-version: '24.13.0'
        cache: npm
        cache-dependency-path: refactor/learning/web/package-lock.json
    - name: Install exact release dependencies
      shell: pwsh
      env:
        REQUIREMENTS: ${{ inputs.requirements }}
      run: python -m pip install --requirement "$env:REQUIREMENTS"
