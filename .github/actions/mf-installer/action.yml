name: Assemble, compile and publish one offline installer
description: Manual offline package only; never changes the online bootstrap stub
inputs:
  version:
    description: Signed release version
    required: true
  ssh-key:
    description: Admin SSH key, never the release signing key
    required: true
runs:
  using: composite
  steps:
    - name: Signed objects to Windows Inno installer to version directory
      shell: pwsh
      env:
        MF_SSH_KEY: ${{ inputs.ssh-key }}
        MF_VERSION: ${{ inputs.version }}
      run: |
        python -B scripts/release/pipeline.py installer --version "$env:MF_VERSION" --work "$env:RUNNER_TEMP/installer"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
