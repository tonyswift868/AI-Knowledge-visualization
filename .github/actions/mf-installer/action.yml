name: Assemble, compile and publish one offline installer
description: Manual offline package only; never changes the online bootstrap stub
inputs:
  version:
    description: Signed release version
    required: true
  ssh-key:
    description: Admin SSH key, never the release signing key
    required: true
runs:
  using: composite
  steps:
    - name: Signed objects to Windows Inno installer to version directory
      shell: pwsh
      env:
        MF_SSH_KEY: ${{ inputs.ssh-key }}
        MF_VERSION: ${{ inputs.version }}
      run: |
        python -B scripts/release/pipeline.py installer --version "$env:MF_VERSION" --work "$env:RUNNER_TEMP/installer"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Publish complete installer to GitHub Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        MF_VERSION: ${{ inputs.version }}
      run: |
        $ErrorActionPreference = 'Stop'
        $installer = Join-Path $env:RUNNER_TEMP 'installer/installer/MentorFlow-Setup.exe'
        $stable = Join-Path $env:RUNNER_TEMP 'installer/stable.json'
        if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "installer output missing: $installer" }
        if (-not (Test-Path -LiteralPath $stable -PathType Leaf)) { throw "signed manifest missing: $stable" }
        $file = Get-Item -LiteralPath $installer
        $sha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
        $manifest = Get-Content -LiteralPath $stable -Encoding UTF8 | ConvertFrom-Json
        $signedVersion = [string]$manifest.signed.version
        if ($signedVersion -ne $env:MF_VERSION) { throw "signed version differs from input" }
        $notes = [string]$manifest.signed.release_notes
        $bodyLines = @(
          "Version: $env:MF_VERSION"
          "Size: $($file.Length) bytes"
          "SHA256: $sha256"
        )
        if (-not [string]::IsNullOrWhiteSpace($notes)) { $bodyLines += @('', $notes) }
        $body = $bodyLines -join "`r`n"
        $bodyPath = Join-Path $env:RUNNER_TEMP ("github-release-$env:MF_VERSION.md")
        [System.IO.File]::WriteAllText($bodyPath, $body, [System.Text.UTF8Encoding]::new($false))
        $tag = "v$env:MF_VERSION"
        $title = "MentorFlow $env:MF_VERSION"
        gh release view $tag --json tagName --repo $env:GH_REPO *> $null
        if ($LASTEXITCODE -eq 0) {
          gh release upload $tag "$installer#MentorFlow-Setup.exe" --clobber --repo $env:GH_REPO
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --title $title --notes-file $bodyPath --latest --repo $env:GH_REPO
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        } else {
          gh release create $tag "$installer#MentorFlow-Setup.exe" --target $env:GITHUB_SHA --title $title --notes-file $bodyPath --latest --repo $env:GH_REPO
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
    - name: Publish installer to IP backup and refresh current version
      shell: pwsh
      env:
        MF_SSH_KEY: ${{ inputs.ssh-key }}
        MF_VERSION: ${{ inputs.version }}
        MF_SSH_KNOWN_HOSTS: ${{ env.MF_SSH_KNOWN_HOSTS }}
      run: |
        $ErrorActionPreference = 'Stop'
        $installer = Join-Path $env:RUNNER_TEMP 'installer/installer/MentorFlow-Setup.exe'
        $sha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
        $key = Join-Path $env:RUNNER_TEMP 'mf-installer-ssh-key'
        $hosts = Join-Path $env:RUNNER_TEMP 'mf-installer-known-hosts'
        [IO.File]::WriteAllText($key, $env:MF_SSH_KEY.Trim() + "`n", [Text.Encoding]::ASCII)
        [IO.File]::WriteAllText($hosts, $env:MF_SSH_KNOWN_HOSTS.Trim() + "`n", [Text.Encoding]::ASCII)
        icacls $key /inheritance:r /grant:r "$env:USERNAME`:F" | Out-Null
        $remote = "mentorflow-admin@89.45.45.28"
        $temp = "/tmp/mf-installer-$env:MF_VERSION.exe"
        & scp -O -i $key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$hosts $installer "$remote`:$temp"
        if ($LASTEXITCODE -ne 0) { throw 'scp to backup server failed' }
        $script = @'
        set -eu
        version="$1"; expected="$2"; temp="$3"
        releases=/opt/mentorflow/update-static/e108/app/releases
        test "$(sha256sum "$temp" | awk '{print $1}')" = "$expected"
        install -o root -g root -m 0644 "$temp" "$releases/.MentorFlow-Setup-$version.exe.tmp"
        mv -f "$releases/.MentorFlow-Setup-$version.exe.tmp" "$releases/MentorFlow-Setup-$version.exe"
        rm -f "$temp"
        printf '{"version":"%s","filename":"MentorFlow-Setup-%s.exe","sha256":"%s"}\n' "$version" "$version" "$expected" > "$releases/.current.json.tmp"
        chown root:root "$releases/.current.json.tmp"; chmod 0644 "$releases/.current.json.tmp"
        mv -f "$releases/.current.json.tmp" "$releases/current.json"
        find "$releases" -maxdepth 1 -type f -name 'MentorFlow-Setup-*.exe' -printf '%f\n' | sort -V | head -n -2 | while IFS= read -r old; do rm -f "$releases/$old"; done
        '@
        $script | & ssh -i $key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$hosts $remote bash -s -- $env:MF_VERSION $sha256 $temp
        if ($LASTEXITCODE -ne 0) { throw 'backup server publish failed' }
