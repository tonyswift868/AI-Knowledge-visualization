name: Enterprise Security

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scanner-lease:
    name: Security scanner dependency lease
    runs-on: [self-hosted, Linux, X64, mentorflow-e1, turkey-ci]
    outputs:
      granted: ${{ steps.gate.outputs.granted }}
    steps:
      - id: gate
        shell: bash
        env:
          ENTERPRISE_SECURITY_SCANNER_LEASE: ${{ vars.ENTERPRISE_SECURITY_SCANNER_LEASE }}
        run: |
          if [ "$ENTERPRISE_SECURITY_SCANNER_LEASE" != "GRANTED" ]; then
            echo "granted=false" >> "$GITHUB_OUTPUT"
            echo "Enterprise security scanner lease is not granted; scans are fail-closed" >&2
            exit 1
          fi
          echo "granted=true" >> "$GITHUB_OUTPUT"

  codeql:
    name: CodeQL / ${{ matrix.language }}
    needs: scanner-lease
    if: needs.scanner-lease.outputs.granted == 'true'
    runs-on: [self-hosted, Linux, X64, mentorflow-e1, turkey-ci]
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  open-source-scanners:
    name: Secret, dependency, license, SAST, and SBOM scans
    needs: scanner-lease
    if: needs.scanner-lease.outputs.granted == 'true'
    runs-on: [self-hosted, Linux, X64, mentorflow-e1, turkey-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require leased preinstalled scanners
        shell: bash
        run: |
          set -euo pipefail
          command -v gitleaks
          command -v osv-scanner
          command -v semgrep
          command -v syft
          command -v npm
          command -v python
      - run: mkdir -p artifacts/enterprise/security
      - name: Secret scan of Git history
        run: >-
          gitleaks git . --config .gitleaks.toml --redact
          --report-format json
          --report-path artifacts/enterprise/security/gitleaks-git.json
      - name: Secret scan of source, config, logs, fixtures, and build artifacts
        run: >-
          gitleaks dir . --config .gitleaks.toml --redact
          --report-format json
          --report-path artifacts/enterprise/security/gitleaks-filesystem.json
      - name: Python dependency vulnerability report
        continue-on-error: true
        run: >-
          osv-scanner scan --lockfile backend/requirements.lock.txt
          --format json --output artifacts/enterprise/security/osv-python.json
      - name: Node dependency vulnerability report
        continue-on-error: true
        run: >-
          osv-scanner scan --lockfile frontend/package-lock.json
          --format json --output artifacts/enterprise/security/osv-node.json
      - name: Node critical audit report
        continue-on-error: true
        working-directory: frontend
        shell: bash
        run: npm audit --omit=dev --audit-level=critical --json > ../artifacts/enterprise/security/npm-audit.json
      - name: SAST
        continue-on-error: true
        run: >-
          semgrep scan --error --json
          --config p/owasp-top-ten
          --config p/python
          --config p/typescript
          --output artifacts/enterprise/security/semgrep.json
      - name: SBOM and component license evidence
        run: |
          python scripts/enterprise/generate_sbom.py --output artifacts/enterprise/security/lockfile-sbom.cdx.json
          python scripts/enterprise/generate_dependency_risk_report.py --sbom artifacts/enterprise/security/lockfile-sbom.cdx.json --output artifacts/enterprise/security/dependency-risk-report.json
          syft dir:backend -o cyclonedx-json=artifacts/enterprise/security/python-sbom.cdx.json -o json=artifacts/enterprise/security/python-syft.json
          syft dir:frontend -o cyclonedx-json=artifacts/enterprise/security/node-sbom.cdx.json -o json=artifacts/enterprise/security/node-syft.json
      - name: Fail unwaived dependency or SAST findings
        run: >-
          python scripts/enterprise/verify_security_waivers.py
          --osv artifacts/enterprise/security/osv-python.json
          --osv artifacts/enterprise/security/osv-node.json
          --npm-audit artifacts/enterprise/security/npm-audit.json
          --semgrep artifacts/enterprise/security/semgrep.json
          --output artifacts/enterprise/security/security-gate.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: enterprise-security-evidence
          path: artifacts/enterprise/security
          if-no-files-found: error
          retention-days: 90
