name: Staging Release and Rollback

on:
  workflow_dispatch:
    inputs:
      backend_image: {description: Immutable backend candidate, type: string, required: true}
      frontend_image: {description: Immutable frontend candidate, type: string, required: true}
      document_worker_image: {description: Immutable document-worker candidate, type: string, required: true}
      backend_rollback_image: {description: Immutable backend rollback, type: string, required: true}
      frontend_rollback_image: {description: Immutable frontend rollback, type: string, required: true}
      document_worker_rollback_image: {description: Immutable document-worker rollback, type: string, required: true}
      backend_promotion_image: {description: Explicit backend promotion tag, type: string, required: true}
      frontend_promotion_image: {description: Explicit frontend promotion tag, type: string, required: true}
      document_worker_promotion_image: {description: Explicit document-worker promotion tag, type: string, required: true}
      base_url: {description: HTTPS staging URL, type: string, required: true}

permissions: {contents: read, packages: read}

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, mentorflow-e1, turkey-ci]
    environment: staging
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Require leased preinstalled k6 and Docker
        shell: bash
        env: {K6_DEPENDENCY_LEASE: "${{ vars.K6_DEPENDENCY_LEASE }}"}
        run: |
          test "$K6_DEPENDENCY_LEASE" = "GRANTED"
          command -v k6
          command -v docker
          docker compose version
      - name: Deploy, migrate, smoke, promote, and rollback on any failed gate
        env:
          MENTORFLOW_ALLOWED_ORIGINS: "${{ vars.MENTORFLOW_ALLOWED_ORIGINS }}"
          MENTORFLOW_RELEASE_TOKEN: "${{ secrets.MENTORFLOW_RELEASE_TOKEN }}"
          PROVIDER_ADAPTER: fake
          LOGIN_PATH: "${{ vars.LOGIN_PATH }}"
          SESSION_PATH: "${{ vars.SESSION_PATH }}"
          WORKSPACE_LIST_PATH: "${{ vars.WORKSPACE_LIST_PATH }}"
          KNOWLEDGE_MAP_PATH: "${{ vars.KNOWLEDGE_MAP_PATH }}"
          PLAN_READ_PATH: "${{ vars.PLAN_READ_PATH }}"
          PROGRESS_READ_PATH: "${{ vars.PROGRESS_READ_PATH }}"
          REVIEW_READ_PATH: "${{ vars.REVIEW_READ_PATH }}"
          COST_READ_PATH: "${{ vars.COST_READ_PATH }}"
          AUDIT_READ_PATH: "${{ vars.AUDIT_READ_PATH }}"
          DOCUMENT_SUBMIT_PATH: "${{ vars.DOCUMENT_SUBMIT_PATH }}"
          DOCUMENT_STATUS_PATH: "${{ vars.DOCUMENT_STATUS_PATH }}"
          AI_TEACHER_PATH: "${{ vars.AI_TEACHER_PATH }}"
          LOAD_USERS_JSON: "${{ secrets.LOAD_USERS_JSON }}"
          TENANT_CORPUS_PATH: ./tests/load/fixtures/tenant-corpus.v1.json
        run: >-
          python scripts/enterprise/release_rollback.py
          --compose-file deploy/enterprise/compose.staging.yml
          --backend-image "${{ inputs.backend_image }}"
          --frontend-image "${{ inputs.frontend_image }}"
          --document-worker-image "${{ inputs.document_worker_image }}"
          --backend-rollback-image "${{ inputs.backend_rollback_image }}"
          --frontend-rollback-image "${{ inputs.frontend_rollback_image }}"
          --document-worker-rollback-image "${{ inputs.document_worker_rollback_image }}"
          --backend-promotion-image "${{ inputs.backend_promotion_image }}"
          --frontend-promotion-image "${{ inputs.frontend_promotion_image }}"
          --document-worker-promotion-image "${{ inputs.document_worker_promotion_image }}"
          --base-url "${{ inputs.base_url }}"
          --receipt artifacts/enterprise/release/staging-release.json
      - name: Resolve semantic application version
        id: app-version
        shell: bash
        run: echo "value=$(python -c 'import json; print(json.load(open(\"frontend/package.json\", encoding=\"utf-8\"))[\"version\"])')" >> "$GITHUB_OUTPUT"
      - name: Write immutable release manifest
        shell: bash
        run: >-
          python scripts/enterprise/generate_release_manifest.py
          --commit "${GITHUB_SHA}"
          --source-tree "$(git rev-parse ${GITHUB_SHA}^{tree})"
          --app-version "${{ steps.app-version.outputs.value }}"
          --status STAGING_VERIFIED
          --backend-image "${{ inputs.backend_image }}"
          --backend-semantic-tag "${{ inputs.backend_promotion_image }}"
          --backend-sbom-ref "container-scan-backend/backend-image-sbom.cdx.json"
          --backend-security-report-ref "container-scan-backend/backend-trivy.sarif"
          --frontend-image "${{ inputs.frontend_image }}"
          --frontend-semantic-tag "${{ inputs.frontend_promotion_image }}"
          --frontend-sbom-ref "container-scan-frontend/frontend-image-sbom.cdx.json"
          --frontend-security-report-ref "container-scan-frontend/frontend-trivy.sarif"
          --document-worker-image "${{ inputs.document_worker_image }}"
          --document-worker-semantic-tag "${{ inputs.document_worker_promotion_image }}"
          --document-worker-sbom-ref "container-scan-document-worker/document-worker-image-sbom.cdx.json"
          --document-worker-security-report-ref "container-scan-document-worker/document-worker-trivy.sarif"
          --published
          --sbom-ref "enterprise-security-evidence/lockfile-sbom.cdx.json"
          --security-report-ref "enterprise-security-evidence/security-gate.json"
          --load-report-ref "staging-release-receipt"
          --qa-evidence "staging-release-receipt"
          --qa-evidence "github-run:${GITHUB_RUN_ID}"
          --output artifacts/enterprise/release/release-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-release-receipt
          path: |
            artifacts/enterprise/release/staging-release.json
            artifacts/enterprise/release/release-manifest.json
          if-no-files-found: error
          retention-days: 90
