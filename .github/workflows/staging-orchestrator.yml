name: Enterprise Staging Orchestrator

on:
  workflow_dispatch:
    inputs:
      host_config_path:
        description: Runner-local reviewed StagingHostConfig (example remains fail-closed for DNS/IPv6/proxy seams)
        type: string
        default: deploy/enterprise/staging/host.racknerd.example.json
      release_manifest_path:
        description: Runner-local EnterpriseReleaseManifest JSON from an immutable build
        type: string
        required: true
      runtime_images_path:
        description: Runner-local RESOLVED immutable runtime image map
        type: string
        required: true
      profile:
        description: Staging compose profile
        type: choice
        options: [minimal, full]
        default: minimal
      run_expanded_load:
        description: Run average, stress, spike, and tenant-isolation after small smoke
        type: boolean
        default: false
      document_hook_path:
        description: Hook config; disabled template keeps E1-04 optional
        type: string
        default: deploy/enterprise/staging/document-hook.disabled.json
      secret_scan_manifest_path:
        description: Runner-local mature-scanner PASS manifest
        type: string
        required: true
      secret_evidence_root:
        description: Runner-local root containing hashed secret-scan reports
        type: string
        required: true

permissions: {contents: read}

concurrency:
  group: mentorflow-enterprise-staging
  cancel-in-progress: false

jobs:
  static-contract:
    runs-on: [self-hosted, Linux, X64, mentorflow-e1, turkey-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Validate orchestrator contracts without deployment
        run: python scripts/enterprise/verify_staging_orchestrator.py

  approved-staging:
    needs: static-contract
    runs-on: [self-hosted, Linux, X64, mentorflow-e1, turkey-ci]
    environment: staging
    timeout-minutes: 120
    env:
      HOST_CONFIG: ${{ inputs.host_config_path }}
      RELEASE_MANIFEST_PATH: ${{ inputs.release_manifest_path }}
      RUNTIME_IMAGES_PATH: ${{ inputs.runtime_images_path }}
      STAGING_PROFILE: ${{ inputs.profile }}
      DOCUMENT_HOOK_PATH: ${{ inputs.document_hook_path }}
      SECRET_SCAN_MANIFEST_PATH: ${{ inputs.secret_scan_manifest_path }}
      SECRET_EVIDENCE_ROOT: ${{ inputs.secret_evidence_root }}
      RESOURCE_BUDGET: deploy/enterprise/staging/resource-budget.initial.json
      SMOKE_CONFIG: deploy/enterprise/staging/smoke.example.json
      PACKAGE_DIR: /opt/mentorflow/releases/github-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_ROOT: /opt/mentorflow/artifacts/github-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Host preflight
        run: >-
          python scripts/enterprise/staging_host_preflight.py
          --host-config "$HOST_CONFIG"
          --resource-budget "$RESOURCE_BUDGET"
          --profile "$STAGING_PROFILE"
          --execute
          --receipt "$EVIDENCE_ROOT/preflight/host-preflight.json"
      - name: Build exact release package
        run: >-
          python scripts/enterprise/build_staging_release_package.py
          --manifest "$RELEASE_MANIFEST_PATH"
          --host-config "$HOST_CONFIG"
          --resource-budget "$RESOURCE_BUDGET"
          --runtime-images "$RUNTIME_IMAGES_PATH"
          --smoke-config "$SMOKE_CONFIG"
          --document-hook "$DOCUMENT_HOOK_PATH"
          --profile "$STAGING_PROFILE"
          --output-dir "$PACKAGE_DIR"
      - name: Backup, migrate, deploy, smoke, and switch current pointer
        run: >-
          python scripts/enterprise/staging_release_orchestrator.py deploy
          --package-dir "$PACKAGE_DIR"
          --host-config "$HOST_CONFIG"
          --preflight-receipt "$EVIDENCE_ROOT/preflight/host-preflight.json"
          --execute
          --receipt "$EVIDENCE_ROOT/deploy/deploy-receipt.json"
      - name: Expanded load and tenant isolation
        if: inputs.run_expanded_load
        run: >-
          python scripts/enterprise/staging_release_orchestrator.py load
          --package-dir "$PACKAGE_DIR"
          --host-config "$HOST_CONFIG"
          --profile average --profile stress --profile spike --profile tenant-isolation
          --base-url "http://127.0.0.1:18080"
          --artifact-root "$EVIDENCE_ROOT/k6"
          --approve-expanded-load
          --execute
      - name: Staging security gates
        run: >-
          python scripts/enterprise/staging_security_runner.py
          --host-config "$HOST_CONFIG"
          --package-dir "$PACKAGE_DIR"
          --base-url "${{ vars.STAGING_BASE_URL }}"
          --secret-scan-manifest "$SECRET_SCAN_MANIFEST_PATH"
          --secret-evidence-root "$SECRET_EVIDENCE_ROOT"
          --execute
          --receipt "$EVIDENCE_ROOT/security/security-receipt.json"
      - name: Collect release evidence bundle
        if: always()
        run: >-
          python scripts/enterprise/collect_staging_evidence.py
          --evidence-root "$EVIDENCE_ROOT"
          --item deploy=deploy
          --item versions=versions
          --item containers=containers
          --item migration=migration
          --item tests=tests
          --item k6=k6
          --item security=security
          --item tenant_isolation=tenant-isolation
          --item backup_refs=backup-refs
          --item otel_refs=otel-refs
          --release-package "$PACKAGE_DIR/release-package.json"
          --index "$EVIDENCE_ROOT/bundle-index.json"
          --archive "$EVIDENCE_ROOT/staging-evidence.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-orchestrator-${{ github.run_id }}-${{ github.run_attempt }}
          path: /opt/mentorflow/artifacts/github-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
