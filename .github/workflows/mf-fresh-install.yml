name: MF fresh install

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-install:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Download and verify latest release asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'mf-fresh-install'
          New-Item -ItemType Directory -Force -Path $root, (Join-Path $root 'evidence') | Out-Null
          $release = Invoke-RestMethod -Headers @{ 'User-Agent' = 'MentorFlow-fresh-install' } -Uri 'https://api.github.com/repos/tonyswift868/AI-Knowledge-visualization/releases/latest'
          $asset = @($release.assets | Where-Object name -eq 'MentorFlow-Setup.exe') | Select-Object -First 1
          if (-not $asset) { throw 'MentorFlow-Setup.exe is missing from the latest release.' }
          $installer = Join-Path $root 'MentorFlow-Setup.exe'
          $downloadUrl = 'https://github.com/tonyswift868/AI-Knowledge-visualization/releases/latest/download/MentorFlow-Setup.exe'
          Invoke-WebRequest -Headers @{ 'User-Agent' = 'MentorFlow-fresh-install' } -Uri $downloadUrl -OutFile $installer
          $actual = Get-Item $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = if ($asset.digest -match '^sha256:(.+)$') { $Matches[1].ToLowerInvariant() } else { $null }
          if (-not $expectedHash) { throw 'Release asset has no sha256 digest.' }
          [ordered]@{
            tag = $release.tag_name
            asset = $asset.name
            release_size = [int64]$asset.size
            downloaded_size = [int64]$actual.Length
            release_digest = $expectedHash
            downloaded_sha256 = $hash
            download_url = $downloadUrl
          } | ConvertTo-Json | Set-Content (Join-Path $root 'evidence/release-verification.json')
          if ($actual.Length -ne [int64]$asset.size -or $hash -ne $expectedHash) { throw 'Downloaded installer does not match the release asset.' }
          "INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MF_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install with the visible default wizard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class Wizard {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [StructLayout(LayoutKind.Sequential)] public struct POINT { public int X; public int Y; }
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindow(string cls, string title);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint msg, IntPtr w, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumChildWindows(IntPtr parent, EnumProc cb, IntPtr l);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetClassName(IntPtr h, StringBuilder sb, int n);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] static extern uint GetDpiForWindow(IntPtr h);
            [DllImport("user32.dll")] static extern bool ClientToScreen(IntPtr h, ref POINT p);
            [DllImport("user32.dll")] static extern bool ScreenToClient(IntPtr h, ref POINT p);
            [DllImport("user32.dll")] static extern IntPtr ChildWindowFromPointEx(IntPtr parent, POINT p, uint flags);
            [DllImport("user32.dll")] static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] static extern void mouse_event(uint flags, uint x, uint y, uint data, UIntPtr extra);
            public static string[] VisibleChildClasses(IntPtr parent) {
              var names = new List<string>();
              EnumChildWindows(parent, (h, l) => {
                if (IsWindowVisible(h)) { var sb = new StringBuilder(256); GetClassName(h, sb, 256); names.Add(sb.ToString()); }
                return true;
              }, IntPtr.Zero);
              return names.ToArray();
            }
            // x, y are wizard client coordinates in the 96-DPI units that Bounds() in branded-pages.iss uses.
            static POINT ScreenPoint(IntPtr wizard, int x, int y) {
              uint dpi = GetDpiForWindow(wizard); if (dpi == 0) dpi = 96;
              var p = new POINT { X = (int)(x * dpi / 96), Y = (int)(y * dpi / 96) };
              ClientToScreen(wizard, ref p); return p;
            }
            public static void MouseClick(IntPtr wizard, int x, int y) {
              var p = ScreenPoint(wizard, x, y);
              SetForegroundWindow(wizard); SetCursorPos(p.X, p.Y);
              mouse_event(0x0002, 0, 0, 0, UIntPtr.Zero); mouse_event(0x0004, 0, 0, 0, UIntPtr.Zero);
            }
            // Same click delivered to the deepest visible child at that point, for when the real mouse misses.
            public static void PostClick(IntPtr wizard, int x, int y) {
              var screen = ScreenPoint(wizard, x, y);
              IntPtr target = wizard;
              while (true) {
                var local = screen; ScreenToClient(target, ref local);
                IntPtr child = ChildWindowFromPointEx(target, local, 0x0001 | 0x0004);
                if (child == IntPtr.Zero || child == target) break;
                target = child;
              }
              var c = screen; ScreenToClient(target, ref c);
              var pos = (IntPtr)((c.Y << 16) | (c.X & 0xFFFF));
              PostMessage(target, 0x0201, (IntPtr)1, pos); PostMessage(target, 0x0202, IntPtr.Zero, pos);
            }
          }
          '@
          $evidence = Join-Path $env:MF_ROOT 'evidence/installer-pages'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $log = Join-Path $env:MF_ROOT 'evidence/installer.log'
          $result = Join-Path $env:MF_ROOT 'evidence/install-result.txt'

          function Save-SetupPage([string]$label, [IntPtr]$wizard) {
            $dir = Join-Path $evidence $label
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            if ($wizard -ne [IntPtr]::Zero) { [Wizard]::VisibleChildClasses($wizard) -join "`n" | Set-Content (Join-Path $dir 'visible-controls.txt') }
            try {
              $bmp = New-Object Drawing.Bitmap([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width, [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Height)
              $gfx = [Drawing.Graphics]::FromImage($bmp)
              $gfx.CopyFromScreen(0, 0, 0, 0, $bmp.Size)
              $bmp.Save((Join-Path $dir 'screen.png'))
              $gfx.Dispose(); $bmp.Dispose()
            } catch { "screenshot_error=$($_.Exception.Message)" | Set-Content (Join-Path $dir 'screenshot-error.txt') }
          }

          # The runner account is an elevated admin (UAC off), and the install core refuses elevated
          # tokens (per_user_install.py main: "per-user mode requires an ordinary user token"). A person
          # installs as an ordinary user with a fresh profile, so do exactly that: a new standard user.
          $password = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24)) + 'aA1!'
          Write-Host "::add-mask::$password"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name 'mfuser' -Password $secure -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group 'Users' -Member 'mfuser' -ErrorAction SilentlyContinue
          $cred = [pscredential]::new("$env:COMPUTERNAME\mfuser", $secure)
          $cred | Export-Clixml (Join-Path $env:RUNNER_TEMP 'mf-user.clixml')
          $shared = 'C:\mf-fresh'
          New-Item -ItemType Directory -Force -Path $shared | Out-Null
          icacls $shared /grant 'mfuser:(OI)(CI)M' | Out-Null
          Copy-Item $env:INSTALLER (Join-Path $shared 'MentorFlow-Setup.exe')
          $userLog = Join-Path $shared 'installer.log'
          # A new user's first logon builds its profile, which can take a minute; do it before timing the wizard.
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $probe = Start-Process -FilePath "$env:SystemRoot\System32\cmd.exe" -ArgumentList '/c', 'whoami > C:\mf-fresh\whoami.txt' -Credential $cred -LoadUserProfile -WorkingDirectory $shared -PassThru -Wait
          Write-Host "profile probe exit=$($probe.ExitCode) after $([int]$clock.Elapsed.TotalSeconds)s, whoami=$(Get-Content C:\mf-fresh\whoami.txt -ErrorAction SilentlyContinue)"
          $profileRoot = (Get-CimInstance Win32_UserProfile | Where-Object { $_.LocalPath -match '\\mfuser(\.|$)' } | Select-Object -First 1).LocalPath
          if (-not $profileRoot) { throw 'Profile of the standard install user was not created.' }
          # Start-Process -Credential hands the child this admin's environment (TEMP, LOCALAPPDATA, ...),
          # so setup tried to write into the admin's temp folder and got "access denied". Give the child
          # the standard user's own folders, as a real logon would.
          function Start-AsUser([string]$file, [string]$arguments, [string]$directory) {
            $psi = [Diagnostics.ProcessStartInfo]::new($file, $arguments)
            $psi.UserName = 'mfuser'; $psi.Domain = $env:COMPUTERNAME; $psi.Password = $cred.Password
            $psi.LoadUserProfile = $true; $psi.UseShellExecute = $false; $psi.WorkingDirectory = $directory
            $own = @{ USERPROFILE = $profileRoot; HOMEDRIVE = $profileRoot.Substring(0, 2); HOMEPATH = $profileRoot.Substring(2)
                      USERNAME = 'mfuser'; APPDATA = "$profileRoot\AppData\Roaming"; LOCALAPPDATA = "$profileRoot\AppData\Local"
                      TEMP = "$profileRoot\AppData\Local\Temp"; TMP = "$profileRoot\AppData\Local\Temp" }
            foreach ($key in $own.Keys) { $psi.Environment[$key] = $own[$key] }
            return [Diagnostics.Process]::Start($psi)
          }
          $p = Start-AsUser (Join-Path $shared 'MentorFlow-Setup.exe') ('/LOG="' + $userLog + '"') $shared
          "installer_pid=$($p.Id)`ninstall_user=mfuser (standard user, fresh profile)" | Set-Content $result
          Write-Host "installer started as standard user mfuser, pid $($p.Id)"
          # Inno's wizard runs in a child process (MentorFlow-Setup.tmp); find it by window class.
          # [NullString]::Value, not $null: PowerShell turns $null into "" for string arguments, which matches only untitled windows.
          $wizard = [IntPtr]::Zero
          for ($i = 0; $i -lt 720 -and $wizard -eq [IntPtr]::Zero -and -not $p.HasExited; $i++) {
            Start-Sleep -Milliseconds 250
            $wizard = [Wizard]::FindWindow('TWizardForm', [NullString]::Value)
          }
          if ($wizard -eq [IntPtr]::Zero) {
            $exit = if ($p.HasExited) { $p.ExitCode } else { 'still running' }
            "interactive_window=not_found`nsetup_process=$exit" | Add-Content $result
            Write-Host "wizard window not found; setup process: $exit"
            Save-SetupPage '000-no-window' ([IntPtr]::Zero)
            Copy-Item $userLog $log -ErrorAction SilentlyContinue
            Get-Process | Sort-Object ProcessName | Select-Object Id,ProcessName,SessionId,MainWindowTitle | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            throw 'Visible installer window did not appear on the clean runner.'
          }
          # The branded pages hide Inno's Next button, so Enter does nothing; click the drawn button like a
          # person does. 610,416 is the centre of PrimaryButton (Bounds 534,394,152,44 in branded-pages.iss).
          # Pages are told apart by which controls are visible: the location page shows the path box
          # (TNewEdit), the finish page shows the options list (TNewCheckListBox).
          $step = 0; $locationClicks = 0; $finishClicks = 0; $nativeSteps = 0
          $deadline = (Get-Date).AddMinutes(20)
          try {
            while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
              $step++
              $wizard = [Wizard]::FindWindow('TWizardForm', [NullString]::Value)
              $classes = if ($wizard -ne [IntPtr]::Zero) { @([Wizard]::VisibleChildClasses($wizard)) } else { @() }
              if ($step -le 60 -or $step % 12 -eq 0) { Save-SetupPage ('{0:D3}-step' -f $step) $wizard }
              $page = if ($classes -contains 'TNewCheckListBox') { 'finish' } elseif ($classes -contains 'TNewEdit') { 'location' } elseif (@($classes | Where-Object { $_ -eq 'TNewButton' }).Count -ge 3) { 'error' } elseif ($classes -contains 'TNewNotebook') { 'preparing' } else { 'installing' }
              Write-Host "step $step page=$page"
              # Inno's own Preparing page (only 取消) is normal while the payload extracts; its error page adds 上一步/安装.
              $nativeSteps = if ($page -eq 'error') { $nativeSteps + 1 } else { 0 }
              if ($nativeSteps -ge 3) { throw 'Installer showed an error page; see the step screenshots and installer.log.' }
              if ($page -eq 'finish') {
                # A person clicks 启动 MentorFlow here; that first launch comes from the installer.
                # After 3 refused clicks fall back to the window close (non-launching finish path).
                $finishClicks++
                "finish_click=$finishClicks step=$step" | Add-Content $result
                if ($finishClicks -le 3) { [Wizard]::MouseClick($wizard, 610, 416) }
                else { [Wizard]::PostMessage($wizard, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null }
              } elseif ($page -eq 'location' -and $locationClicks -lt 6) {
                $locationClicks++
                "location_click=$locationClicks step=$step" | Add-Content $result
                if ($locationClicks % 2) { [Wizard]::MouseClick($wizard, 610, 416) } else { [Wizard]::PostClick($wizard, 610, 416) }
              }
              Start-Sleep -Seconds 5
            }
            if (-not $p.HasExited) {
              Save-SetupPage '999-install-timeout' ([Wizard]::FindWindow('TWizardForm', [NullString]::Value))
              throw 'Visible installer did not finish within 20 minutes.'
            }
          } finally {
            Copy-Item $userLog $log -ErrorAction SilentlyContinue
          }
          "installer_exit_code=$($p.ExitCode)" | Add-Content $result
          Write-Host "installer exited with $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Visible installer failed with exit code $($p.ExitCode)." }

      - name: Check capabilities directly from the clean runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = [ordered]@{ url='https://89.45.45.28/api/enterprise/auth/lifecycle/capabilities'; status_code=$null; connected=$false; elapsed_ms=$null; error_type=$null }
          $clock = [System.Diagnostics.Stopwatch]::StartNew()
          try {
            $response = Invoke-WebRequest -Uri $result.url -Method Get -SkipCertificateCheck -TimeoutSec 30
            $result.status_code = [int]$response.StatusCode
            $result.connected = $true
          } catch {
            $result.error_type = $_.Exception.GetType().FullName
          } finally {
            $clock.Stop()
            $result.elapsed_ms = [int]$clock.Elapsed.TotalMilliseconds
          }
          $result | ConvertTo-Json | Set-Content (Join-Path $env:MF_ROOT 'evidence/capabilities-direct.json')

      - name: Run shortcut launches with both close paths and collect evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class WindowClose { [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr hWnd, uint msg, IntPtr wParam, IntPtr lParam); }
          '@
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $evidence = Join-Path $env:MF_ROOT 'evidence'
          $shell = New-Object -ComObject WScript.Shell
          # Everything runs as the standard user that installed it (see the install step).
          $cred = Import-Clixml (Join-Path $env:RUNNER_TEMP 'mf-user.clixml')
          $profileRoot = (Get-CimInstance Win32_UserProfile | Where-Object { $_.LocalPath -match '\\mfuser(\.|$)' } | Select-Object -First 1).LocalPath
          if (-not $profileRoot) { throw 'Profile of the standard install user was not created.' }
          # Start-Process -Credential hands the child this admin's environment (TEMP, LOCALAPPDATA, ...),
          # so setup tried to write into the admin's temp folder and got "access denied". Give the child
          # the standard user's own folders, as a real logon would.
          function Start-AsUser([string]$file, [string]$arguments, [string]$directory) {
            $psi = [Diagnostics.ProcessStartInfo]::new($file, $arguments)
            $psi.UserName = 'mfuser'; $psi.Domain = $env:COMPUTERNAME; $psi.Password = $cred.Password
            $psi.LoadUserProfile = $true; $psi.UseShellExecute = $false; $psi.WorkingDirectory = $directory
            $own = @{ USERPROFILE = $profileRoot; HOMEDRIVE = $profileRoot.Substring(0, 2); HOMEPATH = $profileRoot.Substring(2)
                      USERNAME = 'mfuser'; APPDATA = "$profileRoot\AppData\Roaming"; LOCALAPPDATA = "$profileRoot\AppData\Local"
                      TEMP = "$profileRoot\AppData\Local\Temp"; TMP = "$profileRoot\AppData\Local\Temp" }
            foreach ($key in $own.Keys) { $psi.Environment[$key] = $own[$key] }
            return [Diagnostics.Process]::Start($psi)
          }
          $desktop = [Environment]::GetFolderPath('CommonDesktopDirectory')
          $userDesktop = Join-Path $profileRoot 'Desktop'
          $shortcuts = @((Get-ChildItem $desktop -Filter '*.lnk' -File -ErrorAction SilentlyContinue), (Get-ChildItem $userDesktop -Filter '*.lnk' -File -ErrorAction SilentlyContinue))
          $link = $shortcuts | Where-Object { $_.BaseName -match 'MentorFlow' } | Select-Object -First 1
          if (-not $link) { throw 'MentorFlow desktop shortcut was not created by the visible installer.' }
          $sc = $shell.CreateShortcut($link.FullName)
          if ([string]::IsNullOrWhiteSpace($sc.TargetPath)) { throw 'MentorFlow shortcut has no target.' }
          $installRoot = Split-Path (Split-Path $sc.TargetPath -Parent) -Parent
          $installParent = Split-Path $installRoot -Parent
          $workingDirectory = if ([string]::IsNullOrWhiteSpace($sc.WorkingDirectory)) { Split-Path $sc.TargetPath -Parent } else { $sc.WorkingDirectory }
          [ordered]@{ path=$link.FullName; target=$sc.TargetPath; arguments=$sc.Arguments; working_directory=$workingDirectory; install_root=$installRoot; install_user='mfuser' } | ConvertTo-Json | Set-Content (Join-Path $evidence 'shortcut.json')

          function Is-MentorFlowProcess($process) {
            if ($process.ProcessName -match 'MentorFlow|UserRuntime') { return $true }
            try { return ([string]$process.Path -eq [string]$sc.TargetPath) } catch { return $false }
          }
          function Get-MentorFlowProcesses { @(Get-Process -ErrorAction SilentlyContinue | Where-Object { Is-MentorFlowProcess $_ }) }
          function Get-MentorFlowWindows { @(Get-MentorFlowProcesses | Where-Object { $_.MainWindowHandle -ne 0 }) }
          function Get-UiWindow($process) {
            try { return [System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$process.MainWindowHandle) } catch { return $null }
          }
          function Read-CapabilityButtons {
            $rows = @()
            foreach ($process in (Get-MentorFlowProcesses)) {
              $window = Get-UiWindow $process
              if ($null -eq $window) { continue }
              try {
                $condition = [System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                  [System.Windows.Automation.ControlType]::Button)
                $buttons = $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, $condition)
                foreach ($button in $buttons) {
                  $name = [string]$button.Current.Name
                  if ($name -in @('注册账号','忘记密码')) {
                    $rows += [ordered]@{ pid=[int]$process.Id; window_title=[string]$process.MainWindowTitle; name=$name; enabled=[bool]$button.Current.IsEnabled; automation_id=[string]$button.Current.AutomationId }
                  }
                }
              } catch { $rows += [ordered]@{ pid=[int]$process.Id; name='UIA_ERROR'; enabled=$null; error=$_.Exception.Message } }
            }
            return $rows
          }
          function Find-LoginCloseButton {
            foreach ($process in (Get-MentorFlowProcesses)) {
              $window = Get-UiWindow $process
              if ($null -eq $window) { continue }
              try {
                $condition = [System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                  [System.Windows.Automation.ControlType]::Button)
                $buttons = $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, $condition)
                foreach ($button in $buttons) {
                  if ($button.Current.IsEnabled -and ([string]$button.Current.Name -match '关闭|Close|退出|Exit|✕|×')) { return $button }
                }
              } catch { }
            }
            return $null
          }
          function Invoke-UiButton($button) {
            if ($null -eq $button) { throw 'login close button not found' }
            try { $button.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); return }
            catch { $button.GetCurrentPattern([System.Windows.Automation.LegacyIAccessiblePattern]::Pattern).DoDefaultAction() }
          }
          function Save-Screen([string]$path) {
            try {
              $bmp = New-Object Drawing.Bitmap([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width, [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Height)
              $gfx = [Drawing.Graphics]::FromImage($bmp); $gfx.CopyFromScreen(0,0,0,0,$bmp.Size); $bmp.Save($path); $gfx.Dispose(); $bmp.Dispose()
            } catch { "screenshot_error=$($_.Exception.Message)" | Set-Content ($path + '.error.txt') }
          }
          function Snapshot([string]$label) {
            $dir = Join-Path $evidence $label; New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Get-Process | Sort-Object ProcessName,Id | Select-Object Id,ProcessName,MainWindowTitle,Path | ConvertTo-Json -Depth 3 | Set-Content (Join-Path $dir 'processes.json')
            Get-MentorFlowWindows | Select-Object Id,ProcessName,MainWindowTitle,MainWindowHandle | ConvertTo-Json | Set-Content (Join-Path $dir 'windows.json')
            $installLogs = Join-Path $installRoot 'Data\logs'; $runtimeRoot = Join-Path $installParent '.MentorFlow-runtime'
            foreach ($source in @($installLogs, $runtimeRoot)) { if (Test-Path $source) { Copy-Item $source (Join-Path $dir (Split-Path $source -Leaf)) -Recurse -Force -ErrorAction SilentlyContinue } }
            Read-CapabilityButtons | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $dir 'capability-buttons.json')
            Save-Screen (Join-Path $dir 'screen.png')
            $hits = Get-ChildItem $dir -Recurse -File -ErrorAction SilentlyContinue | Select-String -Pattern 'capabilities|注册账号|忘记密码|lifecycle|close the current App before continuing' -CaseSensitive:$false -ErrorAction SilentlyContinue
            ($hits | ForEach-Object { $_.Path + ':' + $_.LineNumber + ':' + $_.Line.Trim() }) | Set-Content (Join-Path $dir 'capabilities-evidence.txt')
          }
          function Start-Shortcut([int]$round) {
            $started = Get-Date
            $proc = Start-AsUser $sc.TargetPath $sc.Arguments $workingDirectory
            Write-Host "round $round started from the desktop shortcut, pid $($proc.Id)"
            "round=$round`nlauncher_pid=$($proc.Id)`nstarted=$started" | Set-Content (Join-Path $evidence "round$round-summary.txt")
            return $proc
          }
          function Send-WmClose {
            foreach ($window in (Get-MentorFlowWindows)) { [WindowClose]::SendMessage([IntPtr]$window.MainWindowHandle, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null }
          }

          function Close-ByLoginButton([int]$round) {
            $summary = Join-Path $evidence "round$round-summary.txt"
            try { Invoke-UiButton (Find-LoginCloseButton); 'close_method=login_window_button' | Add-Content $summary }
            catch { "close_method=login_window_button_failed`nerror_type=$($_.Exception.GetType().FullName)" | Add-Content $summary }
            Write-Host "round $round closed with the login window's close button"
          }

          # Round 0 is the first open, started by 启动 MentorFlow on the installer's finish page.
          "round=0`nlaunched_by=installer finish page" | Set-Content (Join-Path $evidence 'round0-summary.txt')
          Start-Sleep -Seconds 60; Snapshot 'round0-before-close'
          Close-ByLoginButton 0
          Start-Sleep -Seconds 30; Snapshot 'round0-after-close'

          $p1 = Start-Shortcut 1; Start-Sleep -Seconds 90; Snapshot 'round1-before-close'
          Close-ByLoginButton 1
          Start-Sleep -Seconds 30; Snapshot 'round1-after-close'

          $p2 = Start-Shortcut 2; Start-Sleep -Seconds 90; Snapshot 'round2-before-close'
          Send-WmClose; 'close_method=WM_CLOSE' | Add-Content (Join-Path $evidence 'round2-summary.txt')
          Start-Sleep -Seconds 30; Snapshot 'round2-after-close'

          $p3 = Start-Shortcut 3; Start-Sleep -Seconds 90; Snapshot 'round3-before-close'
          Send-WmClose; 'close_method=WM_CLOSE_cleanup' | Add-Content (Join-Path $evidence 'round3-summary.txt')
          Start-Sleep -Seconds 30; Snapshot 'round3-after-close'

      - name: Upload fresh install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mf-fresh-install-evidence
          path: ${{ runner.temp }}/mf-fresh-install/evidence
          if-no-files-found: warn
          retention-days: 7
