# Manual signed publication only. Quota red lines: dispatch only, global queue,
# <=40 minutes including installer, no tests/matrix; signatures are made locally.
name: MF publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already signed and staged by the architect
        type: string
        required: true
concurrency:
  group: mentorflow-release
  queue: max
  cancel-in-progress: false
permissions:
  contents: read
env:
  MF_SSH_KNOWN_HOSTS: '89.45.45.28 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICJMlf3cA3DHteuBGx2K1IR+oJbkLSsIjKo4UXC8z5oZ'
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-env
      - name: Verify staged signature, promote objects, backup and atomically replace stable
        shell: pwsh
        env:
          MF_SSH_KEY: ${{ secrets.MF_SSH_KEY }}
          MF_VERSION: ${{ inputs.version }}
        run: python -B scripts/release/pipeline.py promote --version "$env:MF_VERSION" --work "$env:RUNNER_TEMP/promote"
      - uses: ./.github/actions/mf-installer
        with:
          version: ${{ inputs.version }}
          latest: 'true'
          ssh-key: ${{ secrets.MF_SSH_KEY }}
      - name: Remove this staging directory only after successful installer publication
        shell: pwsh
        env:
          MF_SSH_KEY: ${{ secrets.MF_SSH_KEY }}
          MF_VERSION: ${{ inputs.version }}
        run: python -B scripts/release/pipeline.py cleanup --version "$env:MF_VERSION" --work "$env:RUNNER_TEMP/cleanup"
