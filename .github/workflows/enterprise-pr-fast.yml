name: Enterprise PR_FAST

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  fast:
    uses: ./.github/workflows/enterprise-ci.yml
    with:
      lane: PR_FAST

  security-scanner-lease:
    name: PR_FAST / security scanner dependency lease
    runs-on: ubuntu-latest
    outputs:
      granted: ${{ steps.gate.outputs.granted }}
    steps:
      - id: gate
        shell: bash
        env:
          ENTERPRISE_SECURITY_SCANNER_LEASE: ${{ vars.ENTERPRISE_SECURITY_SCANNER_LEASE }}
        run: |
          if [ "$ENTERPRISE_SECURITY_SCANNER_LEASE" != "GRANTED" ]; then
            echo "granted=false" >> "$GITHUB_OUTPUT"
            echo "PR_FAST secret scan is fail-closed until its dependency lease is granted" >&2
            exit 1
          fi
          echo "granted=true" >> "$GITHUB_OUTPUT"

  secret-scan:
    name: PR_FAST / mature secret scan
    needs: security-scanner-lease
    if: needs.security-scanner-lease.outputs.granted == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false

  dependency-review:
    name: PR_FAST / dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          comment-summary-in-pr: never
