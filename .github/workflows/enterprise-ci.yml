name: Enterprise reusable CI lanes

on:
  push:
    branches:
      - "codex/e1s1-shadow-repair-e107-ci-windows"
      - "codex/e1-postgres17-real-gate-r1"
    paths:
      - .github/workflows/enterprise-ci.yml
      - backend/tests/test_enterprise_tenant_persistence.py
      - backend/tests/test_enterprise_postgres_worker_integration.py
      - enterprise_e1/staging/e1_02/compose.yaml
      - enterprise_e1/staging/e1_02/run.sh
      - backend/tests/test_e1b_enterprise_evidence.py
      - scripts/enterprise/pytest_windows_diagnostics.py
      - scripts/enterprise/run_windows_pytest_diagnostic.ps1
  workflow_call:
    inputs:
      lane:
        description: PR_FAST, MAIN_FULL, or SHADOW_REPAIR_E107
        required: true
        type: string
      expected_source_sha:
        description: Exact source SHA required by focused Shadow repair validation
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      lane:
        description: CI lane
        required: true
        type: choice
        options: [PR_FAST, MAIN_FULL, SHADOW_REPAIR_E107]
        default: PR_FAST
      expected_source_sha:
        description: Exact source SHA required by focused Shadow repair validation
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: enterprise-${{ inputs.lane || 'SHADOW_REPAIR_E107' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  MENTORFLOW_PROVIDER_MODE: fake

jobs:
  lane-contract:
    name: ${{ inputs.lane || 'SHADOW_REPAIR_E107' }} / lane contract
    if: github.ref != 'refs/heads/codex/e1-postgres17-real-gate-r1'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate lane and exact focused source
        shell: bash
        env:
          LANE: ${{ inputs.lane || 'SHADOW_REPAIR_E107' }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha || github.event.after }}
        run: |
          case "$LANE" in
            PR_FAST|MAIN_FULL|SHADOW_REPAIR_E107) ;;
            *) echo "Unsupported Enterprise CI lane: $LANE" >&2; exit 1 ;;
          esac
          if [ "$LANE" = "SHADOW_REPAIR_E107" ]; then
            test -n "$EXPECTED_SOURCE_SHA"
            test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          fi

  postgres17-rls-worker-real-gate:
    name: E1-02 / PostgreSQL 17.6 RLS and Worker real gate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/e1-postgres17-real-gate-r1'
    timeout-minutes: 70
    runs-on: [self-hosted, linux, x64, mentorflow-e1, turkey-ci]
    steps:
      - name: Checkout exact trusted branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate exact trigger, runner, source, and changed-path fence
        shell: bash
        env:
          EXPECTED_RUNNER_NAME: mentorflow-e1-turkey-01
          EXPECTED_SOURCE_HEAD: 6e3eaafd36a2a42351d236473a8ae72a2c70aefd
          EXPECTED_SOURCE_TREE: 375f3bcdedf1985f992d464e9fc05516ce838825
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/codex/e1-postgres17-real-gate-r1"
          test "$RUNNER_NAME" = "$EXPECTED_RUNNER_NAME"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$EXPECTED_SOURCE_HEAD^{tree}")" = "$EXPECTED_SOURCE_TREE"
          test "$(git rev-list --count "$EXPECTED_SOURCE_HEAD..HEAD")" = "3"
          git diff --name-only "$EXPECTED_SOURCE_HEAD..HEAD" | sort > /tmp/e102-changed.txt
          printf '%s\n' \
            .github/workflows/enterprise-ci.yml \
            backend/tests/test_enterprise_postgres_worker_integration.py \
            backend/tests/test_enterprise_tenant_persistence.py \
            enterprise_e1/staging/e1_02/compose.yaml \
            enterprise_e1/staging/e1_02/run.sh \
            | sort > /tmp/e102-allowed.txt
          diff -u /tmp/e102-allowed.txt /tmp/e102-changed.txt
          docker compose version
      - name: Execute PostgreSQL 17.6 RLS and real Worker gate
        timeout-minutes: 60
        working-directory: enterprise_e1/staging/e1_02
        shell: bash
        run: ./run.sh
      - name: Always remove only the exact compose project and verify zero residue
        if: always()
        working-directory: enterprise_e1/staging/e1_02
        shell: bash
        run: |
          set -euo pipefail
          compose_project="mf-e102-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export E1_RLS_DATABASE="e102_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_rls"
          export E1_WORKER_DATABASE="e102_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_worker"
          export E1_POSTGRES_PASSWORD="e102-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-only"
          export E1_APP_PASSWORD="e102-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-only"
          docker compose -p "$compose_project" down --volumes --remove-orphans
          containers="$(docker ps -aq --filter "label=com.docker.compose.project=$compose_project")"
          volumes="$(docker volume ls -q --filter "label=com.docker.compose.project=$compose_project")"
          networks="$(docker network ls -q --filter "label=com.docker.compose.project=$compose_project")"
          test -z "$containers"
          test -z "$volumes"
          test -z "$networks"
          printf '{"compose_project":"%s","post_cleanup_containers":0,"post_cleanup_networks":0,"post_cleanup_volumes":0}\n' "$compose_project"

  readiness-provenance:
    name: ${{ inputs.lane }} / GitHub-reachable readiness provenance
    if: inputs.lane == 'PR_FAST' || inputs.lane == 'MAIN_FULL'
    needs: lane-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Regenerate and verify exact canonical readiness lineage
        run: >-
          python scripts/enterprise/generate_readiness_snapshot.py
          --source reports/enterprise/readiness-evidence.json
          --source-commit 8599e8fbbc13f08e35dba761d31eaa3fb988ca3f
          --source-tree 0b7a47303784d6d7d8fb142823e279e8b137e0c7
          --output reports/enterprise/machine/readiness-snapshot.json
          --check
          --expected-snapshot-sha256 d8fc494e827a000f74ab6ed74aa46b65e297903a65c16890cd7b4472e039067a
          --provenance-remote origin
          --provenance-ref refs/heads/checkpoint/mentorflow-e1s1-20260829
          --provenance-ref "refs/tags/mentorflow-e1s1-checkpoint-20260829^{}"

  backend-fast:
    name: PR_FAST / Backend / ${{ matrix.os }} / Python ${{ matrix.python }}
    if: inputs.lane == 'PR_FAST'
    needs: lane-contract
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - name: Lint, dependency, compile, import, contract, and release artifact gates
        env: {PYTHONPATH: backend}
        run: |
          python -m pip check
          python -m tabnanny -q backend/app scripts/enterprise
          python -m compileall -q backend/app scripts/enterprise backend/tests/test_e1b_enterprise_evidence.py
          python -c "import app.main"
          python scripts/enterprise/verify_security_waivers.py
          python scripts/enterprise/generate_sbom.py --check --output reports/enterprise/machine/lockfile-sbom.cdx.json
          python scripts/enterprise/generate_dependency_risk_report.py --check
          python scripts/enterprise/generate_tenant_load_corpus.py --check
          python scripts/enterprise/verify_release_assets.py
      - name: Focused, Personal Local, authorization-negative, tenant-fixture, and fake-migration tests
        timeout-minutes: 45
        env:
          PYTHONPATH: backend
          MENTORFLOW_DB: ${{ runner.temp }}/mentorflow-fast-app.db
          MENTORFLOW_ORM_DB: ${{ runner.temp }}/mentorflow-fast-orm.db
        run: >-
          python -m pytest -q
          backend/tests/test_e1_release_assets.py
          backend/tests/test_e1b_enterprise_evidence.py
          backend/tests/test_local_auth.py
          backend/tests/test_credential_store.py
          backend/tests/test_planning_resource_authorization.py
          backend/tests/test_provider_runtime_v2_security.py
          backend/tests/test_knowledge_map_v1_migration.py

  backend-full:
    name: MAIN_FULL / Backend core / Ubuntu 24.04 / Python ${{ matrix.python }}
    if: inputs.lane == 'MAIN_FULL'
    needs: lane-contract
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - name: Bootstrap exact frozen relock tool
        run: python -m pip install --disable-pip-version-check "uv==0.11.32"
      - name: Full compile/import and release artifact gates
        env: {PYTHONPATH: backend}
        run: |
          python -m pip check
          python -m compileall -q backend/app scripts/enterprise
          python -c "import app.main"
          python scripts/enterprise/verify_release_assets.py
      - name: Complete core backend regression excluding explicit optional suites
        env:
          PYTHONPATH: backend
          MENTORFLOW_DB: ${{ runner.temp }}/mentorflow-full-app-${{ matrix.python }}.db
          MENTORFLOW_ORM_DB: ${{ runner.temp }}/mentorflow-full-orm-${{ matrix.python }}.db
        run: >-
          python -m pytest -q backend/tests backend/tests_w2 backend/tests_w6
          --ignore=backend/tests/test_chunked_adamw.py
          --ignore=backend/tests/test_document_ingestion_windows_compat.py
          --ignore=backend/tests/test_document_source_v1.py
          --ignore=backend/tests/test_qwen3_tts_warm_start.py
          --ignore=backend/tests/test_streaming_safetensors.py
          --ignore=backend/tests/test_classroom_plan_landing.py
          --ignore=backend/tests/test_classroom_visual.py
          --ignore=backend/tests/test_knowledge_map_progress.py
          --ignore=backend/tests/test_life_analogy_prefetch_buffer.py
          --ignore=backend/tests/test_local_migration.py
          --ignore=backend/tests/test_native_desktop_knowledge_map.py
          --ignore=backend/tests/test_plan_time_metrics.py
          --ignore=backend/tests/test_plans_page_scroll_layout.py
          --deselect=backend/tests/test_enterprise_tenant_persistence.py::test_real_postgres_rls_is_fail_closed_and_pool_safe

  backend-full-windows:
    name: ${{ inputs.lane || 'SHADOW_REPAIR_E107' }} / Backend core / Windows / Python ${{ matrix.python }} / shard ${{ matrix.shard }} of 6
    if: inputs.lane == 'MAIN_FULL' || inputs.lane == 'SHADOW_REPAIR_E107' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/e1s1-shadow-repair-e107-ci-windows')
    needs: lane-contract
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - name: Bootstrap exact frozen relock tool
        run: python -m pip install --disable-pip-version-check "uv==0.11.32"
      - name: Full compile/import and release artifact gates
        env: {PYTHONPATH: backend}
        run: |
          python -m pip check
          python -m compileall -q backend/app scripts/enterprise
          python -c "import app.main"
          python scripts/enterprise/verify_release_assets.py
      - name: Bounded diagnostic core backend shard
        shell: pwsh
        timeout-minutes: 105
        env:
          MENTORFLOW_DB: ${{ runner.temp }}/mentorflow-windows-app-${{ matrix.python }}-${{ matrix.shard }}.db
          MENTORFLOW_ORM_DB: ${{ runner.temp }}/mentorflow-windows-orm-${{ matrix.python }}-${{ matrix.shard }}.db
          MENTORFLOW_DIAGNOSTIC_SOURCE_SHA: ${{ github.sha }}
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP "e107-windows-py${{ matrix.python }}-shard-${{ matrix.shard }}"
          & ./scripts/enterprise/run_windows_pytest_diagnostic.ps1 `
            -RepoRoot $env:GITHUB_WORKSPACE `
            -ArtifactsDirectory $artifactDirectory `
            -TimeoutMinutes 100 `
            -ShardIndex ${{ matrix.shard }} `
            -ShardCount 6 `
            -PytestArguments @(
              "backend/tests",
              "backend/tests_w2",
              "backend/tests_w6",
              "--ignore=backend/tests/test_chunked_adamw.py",
              "--ignore=backend/tests/test_document_ingestion_windows_compat.py",
              "--ignore=backend/tests/test_document_source_v1.py",
              "--ignore=backend/tests/test_qwen3_tts_warm_start.py",
              "--ignore=backend/tests/test_streaming_safetensors.py",
              "--ignore=backend/tests/test_classroom_plan_landing.py",
              "--ignore=backend/tests/test_classroom_visual.py",
              "--ignore=backend/tests/test_knowledge_map_progress.py",
              "--ignore=backend/tests/test_life_analogy_prefetch_buffer.py",
              "--ignore=backend/tests/test_local_migration.py",
              "--ignore=backend/tests/test_native_desktop_knowledge_map.py",
              "--ignore=backend/tests/test_plan_time_metrics.py",
              "--ignore=backend/tests/test_plans_page_scroll_layout.py",
              "--deselect=backend/tests/test_enterprise_tenant_persistence.py::test_real_postgres_rls_is_fail_closed_and_pool_safe"
            )
          exit $LASTEXITCODE
      - name: Upload Windows pytest diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e107-windows-py${{ matrix.python }}-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ runner.temp }}/e107-windows-py${{ matrix.python }}-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 14

  backend-document-ml:
    name: MAIN_FULL / Backend document and ML / Ubuntu 24.04 / Python 3.11
    if: inputs.lane == 'MAIN_FULL'
    needs: lane-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-documents.txt
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-documents.txt
      - name: Required document and ML suite
        env: {PYTHONPATH: backend}
        run: >-
          python -m pytest -q
          backend/tests/test_chunked_adamw.py
          backend/tests/test_document_ingestion_windows_compat.py
          backend/tests/test_document_source_v1.py
          backend/tests/test_qwen3_tts_warm_start.py
          backend/tests/test_streaming_safetensors.py

  backend-desktop:
    name: MAIN_FULL / Backend desktop / Windows / Python 3.11
    if: inputs.lane == 'MAIN_FULL'
    needs: lane-contract
    timeout-minutes: 120
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop.txt
      - run: python -m pip install -r backend/requirements-desktop.txt
      - name: Required desktop suite
        timeout-minutes: 105
        env:
          PYTHONPATH: backend
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q
          backend/tests/test_classroom_plan_landing.py
          backend/tests/test_classroom_visual.py
          backend/tests/test_knowledge_map_progress.py
          backend/tests/test_life_analogy_prefetch_buffer.py
          backend/tests/test_local_migration.py
          backend/tests/test_native_desktop_knowledge_map.py
          backend/tests/test_plan_time_metrics.py
          backend/tests/test_plans_page_scroll_layout.py

  frontend:
    name: ${{ inputs.lane }} / Frontend / ${{ matrix.os }} / Node 22.20.0
    if: inputs.lane == 'PR_FAST' || inputs.lane == 'MAIN_FULL'
    needs: lane-contract
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Frontend tests
        run: npm test
      - name: TypeScript and production build
        run: npm run build
      - name: k6 JavaScript syntax seams
        working-directory: .
        shell: bash
        run: find tests/load -name '*.js' -print0 | xargs -0 -n1 node --check

  enterprise-contract:
    name: ${{ inputs.lane }} / frozen enterprise contract and tenant fixtures
    if: inputs.lane == 'PR_FAST' || inputs.lane == 'MAIN_FULL'
    needs: lane-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: python -m pip install -r backend/requirements.txt
      - run: python scripts/enterprise/verify_enterprise_context.py
      - run: python -m pytest -q backend/tests/test_enterprise_contracts_v1.py backend/tests/test_e1b_enterprise_evidence.py

  enterprise-security-corpus:
    name: ${{ inputs.lane || 'SHADOW_REPAIR_E107' }} / enterprise security corpus
    if: inputs.lane == 'MAIN_FULL' || inputs.lane == 'SHADOW_REPAIR_E107' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/e1s1-shadow-repair-e107-ci-windows')
    needs: lane-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: python -m pip install -r backend/requirements.txt
      - name: File, path, provider, URL, and redaction regression
        env:
          PYTHONPATH: backend
          MENTORFLOW_PROVIDER_MODE: fake
          MENTORFLOW_DB: ${{ runner.temp }}/mentorflow-security-app.db
          MENTORFLOW_ORM_DB: ${{ runner.temp }}/mentorflow-security-orm.db
        run: >-
          python -m pytest -q
          backend/tests/test_archive_import_security.py
          backend/tests/test_ingestion_path_security.py
          backend/tests/test_provider_runtime_v2_security.py
          backend/tests/test_provider_url_policy.py
          backend/tests/test_public_path_redaction.py
          backend/tests_w6/test_data_security_recovery.py

  migrations:
    name: ${{ inputs.lane || 'SHADOW_REPAIR_E107' }} / migration round trip
    if: inputs.lane == 'MAIN_FULL' || inputs.lane == 'SHADOW_REPAIR_E107' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/e1s1-shadow-repair-e107-ci-windows')
    needs: lane-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop.txt
      - name: Install Linux Qt runtime for desktop migration imports
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - run: python -m pip install -r backend/requirements-desktop.txt
      - name: Alembic and portable migration gates
        env:
          PYTHONPATH: backend
          QT_QPA_PLATFORM: offscreen
          MENTORFLOW_DB: ${{ runner.temp }}/migration-app.db
          MENTORFLOW_ORM_DB: ${{ runner.temp }}/migration-orm.db
        run: >-
          python -m pytest -q
          backend/tests/test_local_migration.py
          backend/tests/test_knowledge_map_v1_migration.py
          backend/tests/test_api_contract_startup.py

  shadow-repair-contract:
    name: SHADOW_REPAIR_E107 / workflow and watchdog contract
    if: inputs.lane == 'SHADOW_REPAIR_E107' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/e1s1-shadow-repair-e107-ci-windows')
    needs: lane-contract
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Focused E1-07 workflow and diagnostic contracts
        timeout-minutes: 10
        env:
          PYTHONPATH: backend
          MENTORFLOW_DB: ${{ runner.temp }}/mentorflow-contract-app.db
          MENTORFLOW_ORM_DB: ${{ runner.temp }}/mentorflow-contract-orm.db
        run: >-
          python -m pytest -q
          backend/tests/test_e1b_enterprise_evidence.py::test_shadow_repair_e107_workflow_contract
          backend/tests/test_e1b_enterprise_evidence.py::test_windows_diagnostic_shards_are_stable_disjoint_and_complete
          backend/tests/test_e1b_enterprise_evidence.py::test_windows_diagnostic_plugin_records_completed_run
          backend/tests/test_e1b_enterprise_evidence.py::test_windows_shard_manifest_verifier_rejects_omission_or_duplication
      - name: Watchdog timeout captures stalled node, stack, and process tree
        shell: pwsh
        timeout-minutes: 10
        env:
          MENTORFLOW_DIAGNOSTIC_SOURCE_SHA: ${{ github.sha }}
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "e107-watchdog-fixture"
          [void](New-Item -ItemType Directory -Path $scratch -Force)
          $stallTest = Join-Path $scratch "test_e107_watchdog_stall.py"
          [System.IO.File]::WriteAllText(
            $stallTest,
            "import time`n`ndef test_e107_watchdog_stall():`n    time.sleep(300)`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          $artifactDirectory = Join-Path $env:RUNNER_TEMP "e107-watchdog-regression"
          & ./scripts/enterprise/run_windows_pytest_diagnostic.ps1 `
            -RepoRoot $env:GITHUB_WORKSPACE `
            -ArtifactsDirectory $artifactDirectory `
            -TimeoutSeconds 5 `
            -ReturnToCaller `
            -PytestArguments @("--confcutdir=$scratch", $stallTest)
          $watchdogExit = $LASTEXITCODE
          if ($watchdogExit -ne 124) { throw "Expected watchdog exit 124, found $watchdogExit" }
          $result = Get-Content -LiteralPath (Join-Path $artifactDirectory "wrapper-result.json") -Raw | ConvertFrom-Json
          $status = Get-Content -LiteralPath (Join-Path $artifactDirectory "status.json") -Raw | ConvertFrom-Json
          if (-not $result.timed_out -or $result.exit_code -ne 124 -or -not $result.stack_dump_completed -or $result.final_exit_state -ne "TIMED_OUT_CLEANUP_COMPLETE") {
            throw "Watchdog result did not preserve timeout and stack evidence"
          }
          if (-not $result.cleanup_attempted -or $result.cleanup_result -ne "COMPLETE") {
            throw "Watchdog result did not preserve successful process cleanup evidence"
          }
          if ($status.current_phase -ne "call" -or $status.last_started_test -notlike "*test_e107_watchdog_stall*") {
            throw "Watchdog status did not preserve the stalled test call phase"
          }
          foreach ($name in @("collection-manifest.json", "faulthandler.log", "node-timeline.jsonl", "processes-timeout-before-cleanup.json", "processes-after-cleanup.json")) {
            $path = Join-Path $artifactDirectory $name
            if (-not (Test-Path -LiteralPath $path) -or (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Required watchdog artifact missing or empty: $name"
            }
          }
          $processSnapshot = Get-Content -LiteralPath (Join-Path $artifactDirectory "processes-timeout-before-cleanup.json") -Raw | ConvertFrom-Json
          $pythonProcess = @($processSnapshot.processes | Where-Object { $_.image_name -eq "python.exe" })[0]
          foreach ($field in @("pid", "ppid", "executable_path", "full_command_line", "process_creation_time", "captured_at", "capture_phase", "pytest_phase", "cleanup_result", "final_exit_state")) {
            if ($null -eq $pythonProcess.$field -or [string]::IsNullOrWhiteSpace([string]$pythonProcess.$field)) {
              throw "Process metadata field is missing: $field"
            }
          }
          if ($pythonProcess.capture_phase -ne "timeout-before-cleanup" -or $pythonProcess.pytest_phase -ne "call" -or $pythonProcess.cleanup_attempted) {
            throw "Pre-cleanup process snapshot has incorrect phase or cleanup state"
          }
      - name: Upload watchdog regression diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e107-watchdog-regression-${{ github.run_id }}
          path: ${{ runner.temp }}/e107-watchdog-regression
          if-no-files-found: error
          retention-days: 14

  shadow-shard-coverage:
    name: SHADOW_REPAIR_E107 / deterministic shard coverage
    if: always() && (inputs.lane == 'SHADOW_REPAIR_E107' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/e1s1-shadow-repair-e107-ci-windows'))
    needs: [lane-contract, backend-full-windows]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Download every Windows shard diagnostic artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: e107-windows-*-${{ github.run_id }}
          path: ${{ runner.temp }}/e107-windows-artifacts
      - name: Prove mutually exclusive and collectively exhaustive shards
        run: >-
          python scripts/enterprise/pytest_windows_diagnostics.py
          --verify-manifests "${{ runner.temp }}/e107-windows-artifacts"
          --expected-shards 6
          --expected-python-version 3.11
          --expected-python-version 3.12
          --expected-python-version 3.13
          --expected-source-sha "${{ github.sha }}"
          --output "${{ runner.temp }}/e107-shard-coverage-report.json"
      - name: Upload shard coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e107-shard-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/e107-shard-coverage-report.json
          if-no-files-found: error
          retention-days: 14

  shadow-required-gate:
    name: SHADOW_REPAIR_E107 / required gate
    if: always() && (inputs.lane == 'SHADOW_REPAIR_E107' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/e1s1-shadow-repair-e107-ci-windows'))
    needs: [lane-contract, backend-full-windows, enterprise-security-corpus, migrations, shadow-repair-contract, shadow-shard-coverage]
    runs-on: ubuntu-24.04
    steps:
      - name: Reject failed, cancelled, missing, neutral, timed out, or skipped focused jobs
        shell: bash
        env:
          LANE_RESULT: ${{ needs.lane-contract.result }}
          WINDOWS_RESULT: ${{ needs.backend-full-windows.result }}
          SECURITY_RESULT: ${{ needs.enterprise-security-corpus.result }}
          MIGRATION_RESULT: ${{ needs.migrations.result }}
          CONTRACT_RESULT: ${{ needs.shadow-repair-contract.result }}
          SHARD_COVERAGE_RESULT: ${{ needs.shadow-shard-coverage.result }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha || github.event.after }}
        run: |
          for result in "$LANE_RESULT" "$WINDOWS_RESULT" "$SECURITY_RESULT" "$MIGRATION_RESULT" "$CONTRACT_RESULT" "$SHARD_COVERAGE_RESULT"; do
            test "$result" = "success"
          done
          test -n "$EXPECTED_SOURCE_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"

  database-lease:
    name: MAIN_FULL / enterprise database dependency lease
    if: inputs.lane == 'MAIN_FULL'
    needs: lane-contract
    runs-on: ubuntu-24.04
    outputs: {granted: "${{ steps.gate.outputs.granted }}"}
    steps:
      - id: gate
        shell: bash
        env: {E1_DATABASE_DEPENDENCY_LEASE: "${{ vars.E1_DATABASE_DEPENDENCY_LEASE }}"}
        run: |
          if [ "$E1_DATABASE_DEPENDENCY_LEASE" != "GRANTED" ]; then
            echo "granted=false" >> "$GITHUB_OUTPUT"
            echo "REAL_POSTGRES_RLS remains NOT_RUN; RLS is fail-closed" >&2
            exit 1
          fi
          echo "granted=true" >> "$GITHUB_OUTPUT"

  rls:
    name: MAIN_FULL / PostgreSQL RLS
    needs: database-lease
    if: needs.database-lease.outputs.granted == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-bookworm
        env: {POSTGRES_USER: mentorflow_ci, POSTGRES_PASSWORD: mentorflow_ci_only, POSTGRES_DB: mentorflow_ci}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mentorflow_ci -d mentorflow_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: python -m pip install -r backend/requirements.txt
      # Audit vocabulary only; the retired broad selector must never execute:
      # python -m pytest -q backend -m rls
      - name: Require integrated upstream RLS tests
        env:
          MENTORFLOW_RLS_DSN: postgresql://mentorflow_ci:mentorflow_ci_only@127.0.0.1:5432/mentorflow_ci
          DATABASE_URL: postgresql://mentorflow_ci:mentorflow_ci_only@127.0.0.1:5432/mentorflow_ci
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_enterprise_tenant_persistence.py -m rls
