name: Enterprise reusable CI lanes

on:
  workflow_call:
    inputs:
      lane:
        description: PR_FAST or MAIN_FULL
        required: true
        type: string
  workflow_dispatch:
    inputs:
      lane:
        description: CI lane
        required: true
        type: choice
        options: [PR_FAST, MAIN_FULL]
        default: PR_FAST

permissions:
  contents: read

concurrency:
  group: enterprise-${{ inputs.lane }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  MENTORFLOW_PROVIDER_MODE: fake

jobs:
  lane-contract:
    name: ${{ inputs.lane }} / lane contract
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        run: test "${{ inputs.lane }}" = "PR_FAST" || test "${{ inputs.lane }}" = "MAIN_FULL"

  readiness-provenance:
    name: ${{ inputs.lane }} / GitHub-reachable readiness provenance
    needs: lane-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Regenerate and verify exact canonical readiness lineage
        run: >-
          python scripts/enterprise/generate_readiness_snapshot.py
          --source reports/enterprise/readiness-evidence.json
          --source-commit 8599e8fbbc13f08e35dba761d31eaa3fb988ca3f
          --source-tree 0b7a47303784d6d7d8fb142823e279e8b137e0c7
          --output reports/enterprise/machine/readiness-snapshot.json
          --check
          --expected-snapshot-sha256 d8fc494e827a000f74ab6ed74aa46b65e297903a65c16890cd7b4472e039067a
          --provenance-remote origin
          --provenance-ref refs/heads/checkpoint/mentorflow-e1s1-20260829
          --provenance-ref "refs/tags/mentorflow-e1s1-checkpoint-20260829^{}"

  backend-fast:
    name: PR_FAST / Backend / ${{ matrix.os }} / Python ${{ matrix.python }}
    if: inputs.lane == 'PR_FAST'
    needs: lane-contract
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - name: Lint, dependency, compile, import, contract, and release artifact gates
        env: {PYTHONPATH: backend}
        run: |
          python -m pip check
          python -m tabnanny -q backend/app scripts/enterprise
          python -m compileall -q backend/app scripts/enterprise backend/tests/test_e1b_enterprise_evidence.py
          python -c "import app.main"
          python scripts/enterprise/verify_security_waivers.py
          python scripts/enterprise/generate_sbom.py --check --output reports/enterprise/machine/lockfile-sbom.cdx.json
          python scripts/enterprise/generate_dependency_risk_report.py --check
          python scripts/enterprise/generate_tenant_load_corpus.py --check
          python scripts/enterprise/verify_release_assets.py
      - name: Focused, Personal Local, authorization-negative, tenant-fixture, and fake-migration tests
        env:
          PYTHONPATH: backend
          MENTORFLOW_DB: ${{ runner.temp }}/mentorflow-fast-app.db
          MENTORFLOW_ORM_DB: ${{ runner.temp }}/mentorflow-fast-orm.db
        run: >-
          python -m pytest -q
          backend/tests/test_e1_release_assets.py
          backend/tests/test_e1b_enterprise_evidence.py
          backend/tests/test_local_auth.py
          backend/tests/test_credential_store.py
          backend/tests/test_planning_resource_authorization.py
          backend/tests/test_provider_runtime_v2_security.py
          backend/tests/test_knowledge_map_v1_migration.py

  backend-full:
    name: MAIN_FULL / Backend core / ${{ matrix.os }} / Python ${{ matrix.python }}
    if: inputs.lane == 'MAIN_FULL'
    needs: lane-contract
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - name: Full compile/import and release artifact gates
        env: {PYTHONPATH: backend}
        run: |
          python -m pip check
          python -m compileall -q backend/app scripts/enterprise
          python -c "import app.main"
          python scripts/enterprise/verify_release_assets.py
      - name: Complete core backend regression excluding explicit optional suites
        env:
          PYTHONPATH: backend
          MENTORFLOW_DB: ${{ runner.temp }}/mentorflow-full-app-${{ matrix.python }}.db
          MENTORFLOW_ORM_DB: ${{ runner.temp }}/mentorflow-full-orm-${{ matrix.python }}.db
        run: >-
          python -m pytest -q backend/tests backend/tests_w2 backend/tests_w6
          --ignore=backend/tests/test_chunked_adamw.py
          --ignore=backend/tests/test_document_ingestion_windows_compat.py
          --ignore=backend/tests/test_document_source_v1.py
          --ignore=backend/tests/test_qwen3_tts_warm_start.py
          --ignore=backend/tests/test_streaming_safetensors.py
          --ignore=backend/tests/test_classroom_plan_landing.py
          --ignore=backend/tests/test_classroom_visual.py
          --ignore=backend/tests/test_knowledge_map_progress.py
          --ignore=backend/tests/test_life_analogy_prefetch_buffer.py
          --ignore=backend/tests/test_local_migration.py
          --ignore=backend/tests/test_native_desktop_knowledge_map.py
          --ignore=backend/tests/test_plan_time_metrics.py
          --ignore=backend/tests/test_plans_page_scroll_layout.py

  backend-document-ml:
    name: MAIN_FULL / Backend document and ML / Ubuntu 24.04 / Python 3.11
    if: inputs.lane == 'MAIN_FULL'
    needs: lane-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-documents.txt
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-documents.txt
      - name: Required document and ML suite
        env: {PYTHONPATH: backend}
        run: >-
          python -m pytest -q
          backend/tests/test_chunked_adamw.py
          backend/tests/test_document_ingestion_windows_compat.py
          backend/tests/test_document_source_v1.py
          backend/tests/test_qwen3_tts_warm_start.py
          backend/tests/test_streaming_safetensors.py

  backend-desktop:
    name: MAIN_FULL / Backend desktop / Windows / Python 3.11
    if: inputs.lane == 'MAIN_FULL'
    needs: lane-contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop.txt
      - run: python -m pip install -r backend/requirements-desktop.txt
      - name: Required desktop suite
        env:
          PYTHONPATH: backend
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q
          backend/tests/test_classroom_plan_landing.py
          backend/tests/test_classroom_visual.py
          backend/tests/test_knowledge_map_progress.py
          backend/tests/test_life_analogy_prefetch_buffer.py
          backend/tests/test_local_migration.py
          backend/tests/test_native_desktop_knowledge_map.py
          backend/tests/test_plan_time_metrics.py
          backend/tests/test_plans_page_scroll_layout.py

  frontend:
    name: ${{ inputs.lane }} / Frontend / ${{ matrix.os }} / Node 22.20.0
    needs: lane-contract
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Frontend tests
        run: npm test
      - name: TypeScript and production build
        run: npm run build
      - name: k6 JavaScript syntax seams
        working-directory: .
        shell: bash
        run: find tests/load -name '*.js' -print0 | xargs -0 -n1 node --check

  enterprise-contract:
    name: ${{ inputs.lane }} / frozen enterprise contract and tenant fixtures
    needs: lane-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: python -m pip install -r backend/requirements.txt
      - run: python scripts/enterprise/verify_enterprise_context.py
      - run: python -m pytest -q backend/tests/test_enterprise_contracts_v1.py backend/tests/test_e1b_enterprise_evidence.py

  enterprise-security-corpus:
    name: MAIN_FULL / enterprise security corpus
    if: inputs.lane == 'MAIN_FULL'
    needs: lane-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: python -m pip install -r backend/requirements.txt
      - name: File, path, provider, URL, and redaction regression
        env: {PYTHONPATH: backend, MENTORFLOW_PROVIDER_MODE: fake}
        run: >-
          python -m pytest -q
          backend/tests/test_archive_import_security.py
          backend/tests/test_ingestion_path_security.py
          backend/tests/test_provider_runtime_v2_security.py
          backend/tests/test_provider_url_policy.py
          backend/tests/test_public_path_redaction.py
          backend/tests_w6/test_data_security_recovery.py

  migrations:
    name: MAIN_FULL / migration round trip
    if: inputs.lane == 'MAIN_FULL'
    needs: lane-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop.txt
      - run: python -m pip install -r backend/requirements-desktop.txt
      - name: Alembic and portable migration gates
        env: {PYTHONPATH: backend, MENTORFLOW_ORM_DB: "${{ runner.temp }}/migration-gate.db"}
        run: >-
          python -m pytest -q
          backend/tests/test_local_migration.py
          backend/tests/test_knowledge_map_v1_migration.py
          backend/tests/test_api_contract_startup.py

  database-lease:
    name: MAIN_FULL / enterprise database dependency lease
    if: inputs.lane == 'MAIN_FULL'
    needs: lane-contract
    runs-on: ubuntu-24.04
    outputs: {granted: "${{ steps.gate.outputs.granted }}"}
    steps:
      - id: gate
        shell: bash
        env: {E1_DATABASE_DEPENDENCY_LEASE: "${{ vars.E1_DATABASE_DEPENDENCY_LEASE }}"}
        run: |
          if [ "$E1_DATABASE_DEPENDENCY_LEASE" != "GRANTED" ]; then
            echo "granted=false" >> "$GITHUB_OUTPUT"
            echo "REAL_POSTGRES_RLS remains NOT_RUN; RLS is fail-closed" >&2
            exit 1
          fi
          echo "granted=true" >> "$GITHUB_OUTPUT"

  rls:
    name: MAIN_FULL / PostgreSQL RLS
    needs: database-lease
    if: needs.database-lease.outputs.granted == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-bookworm
        env: {POSTGRES_USER: mentorflow_ci, POSTGRES_PASSWORD: mentorflow_ci_only, POSTGRES_DB: mentorflow_ci}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mentorflow_ci -d mentorflow_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: python -m pip install -r backend/requirements.txt
      # Audit vocabulary only; the retired broad selector must never execute:
      # python -m pytest -q backend -m rls
      - name: Require integrated upstream RLS tests
        env:
          MENTORFLOW_RLS_DSN: postgresql://mentorflow_ci:mentorflow_ci_only@127.0.0.1:5432/mentorflow_ci
          DATABASE_URL: postgresql://mentorflow_ci:mentorflow_ci_only@127.0.0.1:5432/mentorflow_ci
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_enterprise_tenant_persistence.py -m rls
