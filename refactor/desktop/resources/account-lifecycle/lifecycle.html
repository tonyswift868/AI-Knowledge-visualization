<!doctype html><html class="login-pf" lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="resources/css/mentorflow.css"></head>
<body class="mentorflow-login mf-native-lifecycle"><div class="login-pf-page"><div class="card-pf">

            <link rel="stylesheet" href="resources/css/account-lifecycle.css">
        <div id="mf-account-lifecycle" hidden>
            <section data-screen="LOGIN" hidden>
                <h2 tabindex="-1">登录 MentorFlow</h2>
                <p id="mf-selected-account"></p>
                <button type="button" data-intent="login" class="mf-primary">继续登录</button>
                <div class="mf-preferences">
                    <label><input id="mf-remember-password" type="checkbox"> 记住密码</label>
                    <label><input id="mf-auto-login" type="checkbox" disabled> 自动登录</label>
                </div>
                <button type="button" data-navigate="ACCOUNT_SELECT">选择已保存账号</button>
                <div class="mf-actions">
                    <button type="button" data-navigate="REGISTER" disabled title="当前账号服务暂未开放注册">注册账号</button>
                    <button type="button" data-navigate="FORGOT_REQUEST" disabled title="当前账号服务暂未开放密码找回">忘记密码</button>
                </div>
            </section>
            <section data-screen="ACCOUNT_SELECT" hidden>
                <h2 tabindex="-1">欢迎回来</h2>
                <div id="mf-saved-accounts" role="group" aria-label="已保存账号"></div>
                <p id="mf-no-saved-accounts">还没有已保存账号。</p>
                <button type="button" id="mf-add-account">+ 添加其他账号</button>
                <button type="button" data-navigate="LOGIN">返回登录</button>
            </section>
            <section data-screen="REGISTER REGISTER_SUBMITTING" hidden>
                <h2 tabindex="-1">创建你的账号</h2>
                <form id="mf-register-form" method="dialog" novalidate>
                    <div class="form-group">
                        <label for="mf-register-username">账号</label>
                        <input class="pf-c-form-control" id="mf-register-username" name="username" autocomplete="username" required aria-describedby="mf-username-hint mf-username-availability mf-username-error">
                        <p id="mf-username-hint" class="mf-hint">账号需要唯一。</p>
                        <p id="mf-username-availability" class="mf-availability" role="status" aria-live="polite" hidden></p>
                        <p id="mf-username-error" class="mf-error" aria-live="polite"></p>
                    </div>
                    <div class="form-group">
                        <label for="mf-register-email">邮箱</label>
                        <input class="pf-c-form-control" id="mf-register-email" name="email" type="email" autocomplete="email" required aria-describedby="mf-email-error">
                        <p id="mf-email-error" class="mf-error" aria-live="polite"></p>
                    </div>
                    <p id="mf-register-password-policy" class="mf-hint">密码长度为 8–128 个字符，无需特定字符组合。</p>
    <div class="form-group">
        <label for="register-password-new" class="pf-c-form__label pf-c-form__label-text">密码</label>
        <div class="pf-c-input-group" dir="ltr">
            <input type="password" id="register-password-new" name="password" data-mf-new-password class="pf-c-form-control"
                    autocomplete="new-password" required
                   aria-describedby="input-error-register-password"
                   aria-invalid="false" />
            <button class="pf-c-button pf-m-control" type="button"
                    data-mf-password-reveal aria-controls="register-password-new" aria-pressed="false"
                    data-label-show="显示密码" data-label-hide="隐藏密码">
                显示密码
            </button>
        </div>
        <span id="input-error-register-password" data-mf-password-error class="pf-c-form__helper-text pf-m-error required kc-feedback-text" aria-live="polite">
        </span>
    </div>
    <div class="form-group">
        <label for="register-password-confirm" class="pf-c-form__label pf-c-form__label-text">确认密码</label>
        <input type="password" id="register-password-confirm" name="password-confirm" data-mf-confirm-password class="pf-c-form-control"
               autocomplete="new-password" required aria-describedby="input-error-register-password-confirm mf-register-password-mismatch"
               aria-invalid="false" />
        <span id="input-error-register-password-confirm" data-mf-confirm-error class="pf-c-form__helper-text pf-m-error required kc-feedback-text" aria-live="polite">
        </span>
        <span id="mf-register-password-mismatch" data-mf-password-mismatch class="pf-c-form__helper-text pf-m-error required kc-feedback-text" aria-live="polite" hidden>
            两次输入的密码不一致，请重新确认。
        </span>
    </div>
                    <p id="mf-register-policy-error" class="mf-error" aria-live="polite"></p>
                    <p id="mf-register-status" role="status" aria-live="polite"></p>
                    <button type="submit" data-mf-pair-submit class="mf-primary" disabled>注册账号</button>
                </form>
                <button type="button" data-navigate="LOGIN">返回登录</button>
            </section>
            <section data-screen="VERIFY_PENDING" hidden>
                <h2 tabindex="-1">验证你的邮箱</h2>
                <p id="mf-verification-summary">账号已创建，验证邮件正在等待发送结果。</p>
                <p id="mf-masked-email" class="mf-account-label"></p>
                <p id="mf-verification-help" class="mf-hint">请输入注册邮件中的 6 位验证码，10 分钟内有效。</p>
                <form id="mf-registration-code-form" method="dialog" novalidate>
                    <label for="mf-registration-code">6 位验证码</label>
                    <input class="pf-c-form-control" id="mf-registration-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
                    <p id="mf-registration-code-status" class="mf-error" role="status" aria-live="polite"></p>
                    <button id="mf-registration-code-submit" type="submit" class="mf-primary" disabled>验证并完成注册</button>
                </form>
                <p id="mf-resend-status" role="status" aria-live="polite"></p>
                <button type="button" id="mf-resend" disabled>重新发送验证码</button>
                <button type="button" id="mf-registration-restart">重新开始注册</button>
                <button type="button" data-navigate="LOGIN">返回登录</button>
            </section>
            <section data-screen="FORGOT_REQUEST FORGOT_SUBMITTING" hidden>
                <h2 tabindex="-1">找回密码</h2>
                <form id="mf-forgot-form" method="dialog" novalidate>
                    <label for="mf-forgot-identity">绑定邮箱</label>
                    <input class="pf-c-form-control" id="mf-forgot-identity" name="email" type="email" autocomplete="email" required>
                    <p id="mf-forgot-status" role="status"></p>
                    <button type="submit" id="mf-forgot-submit" class="mf-primary" disabled>发送验证码</button>
                </form>
                <button type="button" data-navigate="LOGIN">返回登录</button>
            </section>
            <section data-screen="FORGOT_SENT CODE_VERIFYING CODE_INVALID" hidden>
                <h2 tabindex="-1">输入邮箱验证码</h2>
                <p id="mf-forgot-receipt" role="status"></p>
                <form id="mf-code-form" method="dialog" novalidate>
                    <label for="mf-reset-code">6 位验证码</label>
                    <input class="pf-c-form-control" id="mf-reset-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
                    <p id="mf-code-status" role="status" aria-live="polite"></p>
                    <button id="mf-code-submit" type="submit" class="mf-primary" disabled>验证验证码</button>
                </form>
                <button id="mf-code-resend" type="button" disabled>重新发送验证码</button>
                <button type="button" data-navigate="LOGIN">返回登录</button>
            </section>
            <section data-screen="RESET_PASSWORD RESET_WAITING" hidden>
                <h2 tabindex="-1">设置新密码</h2>
                <p id="mf-reset-status" role="status"></p>
                <button id="mf-reset-restart" type="button" hidden>重新获取验证码</button>
                <form id="mf-reset-form" method="dialog" novalidate>
    <div class="form-group">
        <label for="reset-password-new" class="pf-c-form__label pf-c-form__label-text">新密码</label>
        <div class="pf-c-input-group" dir="ltr">
            <input type="password" id="reset-password-new" name="password-new" data-mf-new-password class="pf-c-form-control"
                    autocomplete="new-password" required
                   aria-describedby="input-error-reset-password"
                   aria-invalid="false" />
            <button class="pf-c-button pf-m-control" type="button"
                    data-mf-password-reveal aria-controls="reset-password-new" aria-pressed="false"
                    data-label-show="显示密码" data-label-hide="隐藏密码">
                显示密码
            </button>
        </div>
        <span id="input-error-reset-password" data-mf-password-error class="pf-c-form__helper-text pf-m-error required kc-feedback-text" aria-live="polite">
        </span>
    </div>
    <div class="form-group">
        <label for="reset-password-confirm" class="pf-c-form__label pf-c-form__label-text">确认新密码</label>
        <input type="password" id="reset-password-confirm" name="password-confirm" data-mf-confirm-password class="pf-c-form-control"
               autocomplete="new-password" required aria-describedby="input-error-reset-password-confirm mf-reset-password-mismatch"
               aria-invalid="false" />
        <span id="input-error-reset-password-confirm" data-mf-confirm-error class="pf-c-form__helper-text pf-m-error required kc-feedback-text" aria-live="polite">
        </span>
        <span id="mf-reset-password-mismatch" data-mf-password-mismatch class="pf-c-form__helper-text pf-m-error required kc-feedback-text" aria-live="polite" hidden>
            两次输入的密码不一致，请重新确认。
        </span>
    </div>
                    <button type="submit" data-mf-pair-submit class="mf-primary" disabled>设置新密码</button>
                </form>
                <button type="button" data-navigate="LOGIN">返回登录</button>
            </section>
        </div>
        <script type="module" src="resources/js/account-lifecycle.js"></script>
</div></div><script src="qrc:///qtwebchannel/qwebchannel.js"></script><script type="module" src="resources/js/account-lifecycle-native.js"></script></body></html>
