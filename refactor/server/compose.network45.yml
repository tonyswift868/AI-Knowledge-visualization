# Append LAST to the existing, complete Compose invocation. No images/ports/volumes change.
# Dynamic addresses must never overlap the edge's explicit addresses (BUG-45).
services:
  edge:
    networks:
      internal:
        ipv4_address: 172.18.0.5
      edge:
        ipv4_address: 172.19.0.2
  keycloak:
    environment:
      KC_PROXY_TRUSTED_ADDRESSES: 172.18.0.5
networks:
  internal:
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
          ip_range: 172.18.128.0/17
  edge:
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
          ip_range: 172.19.128.0/17
