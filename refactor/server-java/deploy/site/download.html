<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>下载 MentorFlow</title>
  <style>body{font:16px system-ui,sans-serif;max-width:42rem;margin:12vh auto;padding:0 1.25rem;color:#25231d;background:#fffaf0}a{color:#7a4b00}#status{min-height:1.5em}.links{display:flex;gap:1rem;flex-wrap:wrap}</style>
</head>
<body>
  <main>
    <h1>下载 MentorFlow Windows 版</h1>
    <p id="status" role="status">正在检查下载线路……</p>
    <p>自动选择可用线路；也可以手动选择：</p>
    <div class="links">
      <a id="github" href="https://github.com/tonyswift868/AI-Knowledge-visualization/releases/latest/download/MentorFlow-Setup.exe">GitHub 下载</a>
      <a id="backup" href="https://89.45.45.28/releases/MentorFlow-Setup-2.0.49.exe">备用线路下载</a>
    </div>
  </main>
  <script>
    (() => {
      const status = document.getElementById('status');
      const github = document.getElementById('github');
      const backup = document.getElementById('backup');
      const meta = fetch('/releases/current.json', {cache:'no-store'}).then(r => r.ok ? r.json() : Promise.reject());
      const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 5000));
      const probe = fetch(github.href, {method:'HEAD', mode:'no-cors', redirect:'follow', cache:'no-store'});
      Promise.race([Promise.all([meta, probe]), timeout]).then(([current]) => {
        if (current && current.filename) backup.href = 'https://89.45.45.28/releases/' + encodeURIComponent(current.filename);
        status.textContent = 'GitHub 下载线路可用，正在打开……';
        location.assign(github.href);
      }).catch(() => {
        meta.then(current => { if (current.filename) backup.href = 'https://89.45.45.28/releases/' + encodeURIComponent(current.filename); }).catch(() => {});
        status.textContent = 'GitHub 线路暂时不可用，正在切换备用线路……';
        setTimeout(() => location.assign(backup.href), 0);
      });
    })();
  </script>
</body>
</html>
