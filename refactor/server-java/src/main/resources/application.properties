spring.main.banner-mode=off
server.port=${PORT:8080}
server.address=${MENTORFLOW_BIND_ADDRESS:127.0.0.1}
server.error.whitelabel.enabled=false
# The existing TLS edge forwards HTTPS to this HTTP upstream, as it does for Python.
# Apply the forwarded scheme before native-session and bearer transport checks.
server.forward-headers-strategy=framework
spring.jmx.enabled=false
logging.level.root=WARN
logging.level.win.clannad.mentorflow.identity.RequestAccessLog149Filter=INFO
