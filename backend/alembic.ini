[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# PERSONAL_LOCAL fallback only. ENTERPRISE_SERVER requires the explicit
# MENTORFLOW_MIGRATION_DATABASE_URL contract resolved by alembic/env.py.
sqlalchemy.url = sqlite:///../data/mentorflow_v2.db

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
