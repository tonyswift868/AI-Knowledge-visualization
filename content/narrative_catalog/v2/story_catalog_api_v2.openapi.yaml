openapi: 3.1.0
info:
  title: MentorFlow Story Catalog API
  version: 2.0.0
paths:
  /api/story-catalog/search:
    post:
      summary: Search the offline 10k catalog using filters and FTS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
                record_tiers:
                  type: array
                  items: { enum: [curated_dna, candidate_index] }
                narrative_signals:
                  type: array
                  items: { type: string }
                content_flags:
                  type: array
                  items: { type: string }
                limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200': { description: Ranked metadata results; no scripts or assets. }
  /api/story-catalog/match:
    post:
      summary: Match a task to curated DNA first, then candidates for curator fallback.
      responses:
        '200': { description: Three diverse candidates by default. }
  /api/story-catalog/{catalog_id}:
    get:
      summary: Load one record on demand; never inject all 10k into a model prompt.
      parameters:
        - in: path
          name: catalog_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: One catalog record. }
  /api/story-catalog/{catalog_id}/story-pack-status:
    get:
      summary: Return READY or PACK_REQUIRED.
      responses:
        '200': { description: Story Pack status. }
  /api/story-catalog/{catalog_id}/curation-request:
    post:
      summary: Queue an unverified candidate for human/assistant DNA research.
      responses:
        '202': { description: Curation job queued; Codex does not invent the story. }
  /api/story-catalog/import:
    post:
      summary: Admin-only versioned import of JSONL or SQLite snapshot.
      responses:
        '200': { description: Idempotent import report. }
