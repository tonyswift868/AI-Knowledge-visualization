immutable_facts:
  - This pack exists only to verify the Narrative Runtime contract.
  - Learning results are decided by Tutor and Evaluator, never by a character.
timeline_rules:
  - Fixed scenes must be visited in story_order.
  - A delayed learning session pauses the gate; it does not skip the anchor.
world_rules:
  - This is a development fixture with no production setting.
main_plot_anchors: [dev_intro, dev_learning, dev_choice, dev_assessment]
forbidden_reveals:
  - Do not expose true_identity, secrets, or active_secrets to the player.
ending_conditions:
  dev_assessment: DAILY_VARIANT_TEST_PASSED
  dev_postgame: FINAL_ASSESSMENT_PASSED
allowed_small_adaptations:
  - Date label
  - Workspace title
  - Neutral transition wording
forbidden_adaptations:
  - Reordering fixed anchors
  - Changing learning gate outcomes
  - Adding unverified knowledge
