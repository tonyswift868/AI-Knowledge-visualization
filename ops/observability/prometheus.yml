global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mentorflow-backend
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: mentorflow-otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]
